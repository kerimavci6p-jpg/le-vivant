<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11152b">
<meta name="description" content="Le Vivant : collectionnez les animaux du monde entier en sachets de cartes, et affrontez vos amis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Le Vivant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="preload" as="image" href="art/fond.webp">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout : une application d'une seule colonne (480 px au plus), en-tête, vue, barre d'onglets en bas.
   Monde unique et sombre, « bibliothèque de nuit » : encre bleue, papier crème, dorure. */
:root{
  --ink:#11152b; --ink-2:#1b2142; --ink-3:#262d57;
  --paper:#efe4cc; --paper-dim:#b8ad94; --gold:#d8ab4c; --gold-hi:#f3d58c; --oxblood:#a3303f; --win:#7fc79a;
  --line:rgba(239,228,204,.16);
  --f-display:"Cinzel",Georgia,serif;
  --f-title:"Cormorant Garamond",Georgia,serif;
  --f-body:"EB Garamond",Georgia,"Times New Roman",serif;
  --r-bronze:#b9814f; --r-argent:#cfd6de; --r-or:#e3b653; --r-noire:#c23b4c; --r-legende:#f3d58c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%,var(--ink-3),transparent 70%),var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.logo{font-family:var(--f-display);font-size:24px;letter-spacing:.02em;color:var(--gold-hi);line-height:1}
.logo small{display:block;font-family:var(--f-body);font-style:italic;font-size:12px;color:var(--paper-dim);letter-spacing:0;margin-top:3px}
.stock{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--paper-dim);text-align:right;line-height:1.25}
.stock b{color:var(--paper);font-size:18px;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding:4px 16px 20px;min-height:0}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--ink-2);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:12px 4px 13px;font-family:var(--f-display);font-size:16px;color:var(--paper-dim);cursor:pointer}
nav button[aria-current="true"]{color:var(--gold-hi);box-shadow:inset 0 2px 0 var(--gold)}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:10px 0 2px;text-wrap:balance;color:var(--paper)}
.lead{color:var(--paper-dim);margin:0 0 14px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:1px solid var(--gold);
  background:linear-gradient(var(--gold-hi),var(--gold));color:#2a1d06;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--paper);border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- la carte ---------- */
.card{--rc:#cfc6b2;position:relative;aspect-ratio:5/7.3;width:100%;max-width:100%;border-radius:12px;padding:4px;container-type:inline-size;
  background:linear-gradient(150deg,color-mix(in srgb,var(--rc) 85%,#fff),var(--rc) 45%,color-mix(in srgb,var(--rc) 55%,#000));
  box-shadow:0 10px 22px rgba(0,0,0,.45)}
.card.r-argent{--rc:var(--r-argent)} .card.r-or{--rc:var(--r-or)} .card.r-noire{--rc:var(--r-noire)}
.card.r-noire{background:linear-gradient(150deg,#45434c,#17161b 50%,#2a272f);box-shadow:0 0 0 1.5px var(--r-noire),0 10px 22px rgba(0,0,0,.5)}
.card.r-legende{--rc:var(--r-legende);background:linear-gradient(120deg,#fff3c9,#d8ab4c 25%,#9fc0e8 50%,#d8ab4c 75%,#fff3c9);background-size:250% 250%;animation:foil 6s ease-in-out infinite}
@keyframes foil{50%{background-position:100% 100%}}
.in{position:relative;height:100%;border-radius:8px;overflow:hidden;background:var(--ink);color:var(--paper)}
/* full art : l'illustration couvre toute la carte, le texte passe par-dessus */
.art{position:absolute;inset:0;overflow:hidden;
  background:repeating-radial-gradient(circle at 50% 38%,rgba(255,248,230,.06) 0 2px,transparent 2px 9px),
  radial-gradient(85% 65% at 50% 32%,color-mix(in srgb,var(--pk) 70%,#fff3d6),var(--pk) 55%,color-mix(in srgb,var(--pk) 35%,#05060f))}
.art img{position:absolute;left:3%;top:9%;width:94%;height:62%;object-fit:contain;object-position:50% 40%;
  -webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.art .ph{position:absolute;inset:0 0 34%;display:grid;place-items:center;align-content:center;gap:2px;color:rgba(255,248,230,.92);text-align:center}
.art .ph b{font-family:var(--f-display);font-weight:400;font-size:52cqw;line-height:.9;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.art .ph span{font-style:italic;font-size:6.2cqw;opacity:.85}
.rare{position:absolute;z-index:2;top:4cqw;right:4cqw;font-family:var(--f-display);font-size:6.4cqw;padding:1.2cqw 3.4cqw;border-radius:99px;background:rgba(10,12,26,.72);color:var(--rc);letter-spacing:.04em;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pack{position:absolute;z-index:2;top:4cqw;left:4cqw;font-size:5.6cqw;font-style:italic;padding:1cqw 3cqw;border-radius:99px;background:rgba(255,248,230,.82);color:#241b10}
.txt{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:16cqw 4.5cqw 4cqw;
  background:linear-gradient(transparent,rgba(9,11,25,.72) 30%,rgba(9,11,25,.93))}
.nm{font-family:var(--f-title);font-size:10cqw;line-height:1.05;text-wrap:balance;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.wk{font-style:italic;font-size:5.2cqw;margin-top:.8cqw;color:var(--paper-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw 3cqw;margin-top:2.4cqw;font-size:5.6cqw;font-variant-numeric:tabular-nums}
.st div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(239,228,204,.18)}
.st span{color:var(--paper-dim)} .st b{font-weight:700}
.pw{margin-top:2.6cqw;padding:2cqw 3cqw;border-radius:2.5cqw;background:color-mix(in srgb,var(--rc) 26%,rgba(9,11,25,.6));font-size:5.3cqw;line-height:1.25;border:1px solid color-mix(in srgb,var(--rc) 45%,transparent)}
.pw b{font-family:var(--f-title);font-style:italic;font-weight:400;color:var(--gold-hi)}
.card.mini .st,.card.mini .pw,.card.mini .wk,.card.mini .pack{display:none}
.card.mini .txt{padding:14cqw 5cqw 5cqw}
.card.mini .nm{font-size:12cqw}
.card.mini .rare{font-size:9cqw;top:4cqw;right:4cqw}
.card.mini .art img{height:92%}
.cnt{position:absolute;bottom:-6px;right:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:99px;background:var(--gold);color:#2a1d06;font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.back{aspect-ratio:5/7.3;border-radius:12px;background:
  repeating-linear-gradient(45deg,rgba(216,171,76,.12) 0 2px,transparent 2px 10px),
  radial-gradient(circle at 50% 50%,var(--gold) 0 13%,var(--ink-2) 13.5% 16%,transparent 16.5%),var(--ink-3);
  box-shadow:inset 0 0 0 2px var(--gold),0 10px 22px rgba(0,0,0,.45)}

/* ---------- sachets ---------- */
.sachet{width:min(62%,240px);margin:12px auto 6px;aspect-ratio:5/8;border-radius:14px;position:relative;cursor:pointer;border:0;padding:0;display:block;
  background:linear-gradient(160deg,#2a3470,#141a3d 55%,#3b1f3a);box-shadow:0 0 0 2px var(--gold),0 22px 40px rgba(0,0,0,.6);overflow:hidden}
.sachet:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,240,200,.22) 45%,transparent 60%);background-size:250% 100%;animation:sheen 4s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.sachet .t{position:absolute;inset:12% 8% auto;text-align:center;font-family:var(--f-display);color:var(--gold-hi);font-size:30px;line-height:1}
.sachet .t small{display:block;font-family:var(--f-body);font-style:italic;font-size:13px;color:var(--paper);margin-top:8px}
.sachet .seal{position:absolute;left:50%;top:55%;width:42%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4545f,var(--oxblood) 60%,#5c1420);box-shadow:0 4px 10px rgba(0,0,0,.5);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:#f6d7c4}
.sachet .five{position:absolute;bottom:9%;left:0;right:0;text-align:center;font-style:italic;color:var(--paper-dim);font-size:13px}
@media (prefers-reduced-motion:reduce){.sachet:after,.card.r-legende{animation:none}}
.timer{text-align:center;color:var(--paper-dim);font-size:13px;margin:6px 0 14px}
.odds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px;font-size:12px;text-align:center;color:var(--paper-dim)}
.odds b{display:block;font-family:var(--f-display);font-weight:400;font-size:14px}
.opened{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;margin-top:8px}
.opened>*{width:calc((100% - 24px)/3)}
.flip{position:relative;perspective:900px;cursor:pointer;background:none;border:0;padding:0}
.flip .fi{position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flip .fi>*{backface-visibility:hidden}
.flip .fi>.card{position:absolute;inset:0;transform:rotateY(180deg)}
.flip.on .fi{transform:rotateY(180deg)}
.new{position:absolute;z-index:3;top:-8px;left:-6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--win);color:#0d2416}
@media (prefers-reduced-motion:reduce){.flip .fi{transition:none}}

/* ---------- album ---------- */
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px}
.grid>button{position:relative;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.miss{aspect-ratio:5/7.3;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;align-content:center;gap:2px;color:var(--paper-dim);font-size:11px;text-align:center;padding:4px}
.miss b{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--line)}
.packs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:99px;padding:7px 12px;font-size:13px;color:var(--paper-dim);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

/* ---------- fiche ---------- */
#view{position:fixed;inset:0;z-index:20;background:rgba(8,10,22,.88);display:grid;place-items:center;padding:20px 16px}
#view[hidden]{display:none}
#view .box{width:min(340px,86vw);display:grid;gap:12px;justify-items:center}
#view p{margin:0;text-align:center;color:var(--paper-dim);font-size:13px}


/* ---------- duel ---------- */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 10px}
.score div{font-size:13px;color:var(--paper-dim);line-height:1.2}
.score div:last-child{text-align:right}
.score b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--paper)}
.score .sc{font-family:var(--f-display);font-size:34px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px;margin-top:4px}
.score div:last-child .pips{justify-content:flex-end}
.pips i{width:10px;height:10px;border-radius:50%;border:1px solid var(--gold);display:block}
.pips i.on{background:var(--gold)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px;border-radius:16px;
  background:radial-gradient(80% 90% at 50% 50%,rgba(216,171,76,.12),transparent 70%),var(--ink-2);border:1px solid var(--line)}
.slot{min-width:0;display:grid;gap:6px;justify-items:center}
.slot .lab{font-size:12px;color:var(--paper-dim)}
.slot>.card,.slot>.back,.slot .empty{max-width:112px}
.slot .empty{width:100%;aspect-ratio:5/7.3;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--paper-dim);font-size:12px;text-align:center;padding:6px}
.vs{text-align:center;font-family:var(--f-display);color:var(--gold-hi);font-size:15px;line-height:1.2;max-width:84px}
.vs b{display:block;font-size:26px}
.val{font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.val.w{color:var(--win)} .val.l{color:#ff9aa5}
.parts{font-size:11.5px;color:var(--paper-dim);text-align:center;line-height:1.3;min-height:1.3em}
.msg{margin:10px 0 8px;text-align:center;font-size:15px;min-height:1.5em;text-wrap:balance}
.msg b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block;color:var(--gold-hi)}
.msg b.ko{color:#ff9aa5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats button{border:1px solid var(--line);background:var(--ink-2);border-radius:12px;padding:6px 4px;cursor:pointer;line-height:1.2}
.stats button b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.stats button small{display:none}
.stats button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--ink-2))}
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hand.n5{grid-template-columns:repeat(5,1fr)} .hand.n6{grid-template-columns:repeat(6,1fr)}
.hand button{position:relative;background:none;border:0;padding:0;cursor:pointer;min-width:0;transition:transform .2s}
.hand button.sel{transform:translateY(-10px)}
.hand button.sel .card{box-shadow:0 0 0 2px var(--gold-hi),0 12px 24px rgba(0,0,0,.6)}
.hv{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:var(--gold);color:#2a1d06;font-weight:700;font-size:12px;padding:1px 7px;border-radius:99px;white-space:nowrap}
.hv.up{background:var(--win);color:#0d2416}
.loan{position:absolute;top:-7px;left:-4px;font-size:10px;padding:1px 6px;border-radius:99px;background:var(--paper-dim);color:var(--ink)}
.tip{margin:12px 0 6px;font-size:13px;color:var(--paper-dim);text-align:center;min-height:2.6em}
.tip b{color:var(--paper);font-family:var(--f-title);font-style:italic;font-weight:400}
.end{text-align:center;padding:20px 0}
.end .big{font-family:var(--f-display);font-size:40px;color:var(--gold-hi);margin:6px 0}
.end .big.ko{color:#ff9aa5}
.rules{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:16px;font-size:13.5px;color:var(--paper-dim)}
.rules summary{cursor:pointer;color:var(--paper);font-family:var(--f-display);font-size:16px}
.rules p{margin:8px 0 0}
/* ---------- cartes full art (décor dans l'image) ---------- */
.card.fa .art img{left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;-webkit-mask-image:none;mask-image:none}
.card.fa .txt{padding-top:20cqw;background:linear-gradient(transparent,rgba(7,10,22,.55) 25%,rgba(7,10,22,.9) 60%)}
.glare{position:absolute;inset:0;pointer-events:none;z-index:3;font-style:normal}
.glare{mix-blend-mode:overlay;opacity:.5;background:radial-gradient(circle at var(--mx,35%) var(--my,25%),rgba(255,255,255,.75),transparent 45%)}
.mini .glare{display:none}
/* ---------- la scène d'ouverture (reprise de ClubDeck) ---------- */
#stage{position:fixed;inset:0;z-index:40;background:var(--ink);overflow:hidden;display:grid;grid-template:100%/100%;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
#stage[hidden],#res[hidden]{display:none}
#stage>*{grid-area:1/1}
#tint{position:fixed;left:0;top:0;width:100vw;height:100%;grid-area:auto;background-color:var(--ink-3);transition:background-color .8s}
#tint::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,12,26,.05),rgba(10,12,26,.35) 35%,var(--ink) 80%)}
.skip{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;border:1px solid rgba(239,228,204,.4);background:rgba(10,12,26,.5);border-radius:99px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#stage.done:not(.result) .skip{opacity:1;pointer-events:auto}
.pkwrap{position:relative;z-index:25;display:flex;flex-direction:column;align-items:center;transition:opacity .4s}
.tap{margin:0 0 18px;text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:var(--paper-dim);text-align:center;max-width:280px;line-height:1.6}
.pk{width:min(58vw,36vh,250px);aspect-ratio:5/8.2;display:flex;flex-direction:column;cursor:grab;touch-action:none;container-type:inline-size;filter:drop-shadow(0 24px 28px rgba(0,0,0,.6));transition:transform .5s,opacity .5s}
#stage:not(.opening):not(.tearing) .pk{animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:perspective(700px) rotateY(-14deg) rotateX(3deg)}50%{transform:perspective(700px) rotateY(14deg) rotateX(-2deg)}}
.pk.nudge{animation:nudge .5s ease-in-out!important}
@keyframes nudge{25%{transform:translateX(-10px) rotate(-2deg)}75%{transform:translateX(10px) rotate(2deg)}}
.ptop,.pbody{position:relative;width:100%;--foil:linear-gradient(100deg,#0e2a40,#1f5f8b 22%,#0b1f30 45%,#1b4f73 68%,#0a1826)}
.crimp{background:repeating-linear-gradient(90deg,#f3d58c 0 2px,#a8892f 2px 4px,#e3c768 4px 5px)}
.ptop{height:13%;background:var(--foil);display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .6s}
.ptop .crimp{flex:1}
.pull{height:44%;display:flex;align-items:center;justify-content:flex-end;padding:0 8%;font-size:4cqw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-hi);border-top:1px solid #a8892f;border-bottom:1px dashed var(--gold-hi)}
.pull b{animation:pullb 1.4s ease-in-out infinite}
@keyframes pullb{50%{transform:translateX(-35%)}}
.pbody{flex:1;overflow:hidden;background:var(--foil)}
.pbody img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
.pbody .crimp{position:absolute;left:0;right:0;bottom:0;height:6%}
.ptitle{position:absolute;left:0;right:0;top:7%;text-align:center;line-height:1}
.ptitle b{display:block;font-family:var(--f-display);font-weight:400;font-size:15cqw;color:var(--gold-hi);text-shadow:0 1cqw 0 rgba(0,0,0,.55),0 0 6cqw rgba(0,0,0,.6)}
.ptitle span{display:block;margin-top:2cqw;font-size:4.6cqw;letter-spacing:.12em;text-transform:uppercase;font-weight:600;text-shadow:0 1px 4px #000}
.gloss{position:absolute;inset:0;pointer-events:none;animation:gloss 5s ease-in-out infinite;background:linear-gradient(100deg,transparent 18%,rgba(255,255,255,.22) 30%,transparent 42%) 0 0/200% 100%,linear-gradient(90deg,rgba(0,0,0,.3),transparent 12% 88%,rgba(0,0,0,.34))}
@keyframes gloss{50%{background-position:100% 0,0 0}}
#stage.opening .tap{opacity:0}
#stage.opening .pk{transform:scale(1.05)}
#stage.torn .ptop{transform:translate(30%,-240%) rotate(24deg)!important;opacity:0}
#stage.opened .pkwrap{opacity:0;pointer-events:none;transform:translateY(60%)}
#stage.done .pkwrap{visibility:hidden}
.sparks{position:relative;width:100%;height:100%;pointer-events:none;z-index:30}
.sparks i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 8px 2px rgba(255,236,190,.8)}
#stage.opening .sparks i{animation:spark 1.5s ease-out var(--dl) both}
@keyframes spark{0%{opacity:0;transform:translateY(10px) scale(.3)}30%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1)}}
.deck{position:relative;z-index:20;width:100%;height:100%;display:grid;place-items:center;pointer-events:none}
#stage.done .deck{pointer-events:auto}
.deck>.sc{grid-area:1/1;width:min(70vw,46vh,330px);aspect-ratio:5/7.3;position:relative;transform-style:preserve-3d;opacity:0;
  transform:translateY(30%) scale(.5) rotateY(180deg);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}
#stage.torn .sc{opacity:1;transform:translateY(calc(-30% - var(--k)*1.3%)) scale(.55) rotateY(180deg);transition-delay:calc(.15s + var(--k)*45ms)}
#stage.opened .sc.wait{opacity:1;transform:translateY(calc(var(--d)*-1.7%)) scale(calc(1 - var(--d)*.03)) rotateY(180deg)}
#stage.opened .sc.cur{opacity:1;transform:none}
#stage.opened .sc.cur.reveal{transition:transform 1.4s cubic-bezier(.6,0,.2,1),opacity .5s}
#stage.opened .sc.gone{opacity:0;transform:translate(calc(var(--dir,1)*140%),-6%) rotate(calc(var(--dir,1)*18deg))}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .08s linear;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.sc.cur:not(.hand) .tilt{animation:tsway 6s ease-in-out infinite}
@keyframes tsway{0%,100%{transform:rotateX(5deg) rotateY(-8deg)}50%{transform:rotateX(-2deg) rotateY(8deg)}}
.sfront,.sback{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sfront>.card{height:100%;box-shadow:0 26px 40px rgba(0,0,0,.6)}
.sback{transform:rotateY(180deg);border-radius:12px;background:repeating-linear-gradient(45deg,rgba(216,171,76,.14) 0 2px,transparent 2px 10px),radial-gradient(circle at 50% 50%,var(--gold) 0 13%,var(--ink-2) 13.5% 16%,transparent 16.5%),var(--ink-3);box-shadow:inset 0 0 0 3px var(--gold),0 0 30px 6px rgba(243,213,140,.45)}
.sc.hl.cur .tilt::before{content:"";position:absolute;inset:-8%;border-radius:14%;background:var(--glow);filter:blur(28px);transform:translateZ(-1px);animation:burst .9s ease-out 1s both,halo 2.6s ease-in-out 1.9s infinite}
@keyframes burst{0%{opacity:0;transform:translateZ(-1px) scale(.85)}40%{opacity:1;transform:translateZ(-1px) scale(1.14)}100%{opacity:.7;transform:translateZ(-1px) scale(1)}}
@keyframes halo{50%{opacity:.4}}
.sc .new{top:-10px;left:-6px;z-index:5;font-size:12px;padding:3px 9px;transform:translateZ(3px)}
.sfoot{position:fixed;z-index:40;left:0;width:100vw;grid-area:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#stage.opened:not(.result) .sfoot{opacity:1}
.dots{display:flex;gap:7px;justify-content:center}
.dots span{width:6px;height:6px;border-radius:6px;background:rgba(239,228,204,.35);transition:width .3s,background .3s}
.dots span.a{width:20px;background:var(--paper)}
.hint{margin:12px 16px 0;font-size:12px;color:var(--paper-dim);transition:opacity .5s}
.res{position:relative;z-index:45;width:100%;max-width:480px;padding:24px 16px;display:grid;gap:16px;justify-items:center;text-align:center}
.res h2{margin:0}
.res .lead{margin:0}.res .lead b{color:var(--paper)}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.rgrid button{position:relative;background:none;border:0;padding:0;cursor:pointer;min-width:0;animation:pop .5s cubic-bezier(.2,.8,.2,1) calc(var(--i)*80ms) both}
.rgrid .new{top:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;padding:2px 6px}
.new.dup{background:var(--paper-dim);color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
#stage.result .deck,#stage.result .pkwrap{visibility:hidden}
@media (prefers-reduced-motion:reduce){#stage .pk,.gloss,.pull b,.sc.cur .tilt,#stage.opening .sparks i,.sc.hl.cur .tilt::before,.rgrid button{animation:none!important}}
/* le sachet de l'accueil montre une vraie illustration */
.sachet img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.sachet .t{z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.sachet .five{z-index:1;color:var(--paper);text-shadow:0 1px 4px #000}
.hr{display:flex;align-items:center;gap:10px}
.acb{border:1px solid var(--line);background:var(--ink-2);border-radius:99px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--paper)}
.acb.on{border-color:var(--win);color:var(--win)}
#acct{position:fixed;inset:0;z-index:60;background:rgba(8,10,22,.97);display:grid;place-items:start center;padding:24px 16px;overflow-y:auto}
.abox{width:100%;max-width:420px;display:grid;gap:12px}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ahead h2{margin:0}
.abox label{display:grid;gap:4px;font-size:13px;color:var(--paper-dim)}
.abox input{font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);color:var(--paper)}
.abox .row{justify-content:flex-start}
.amsg{font-size:13px;color:var(--paper-dim);margin:0}
.amsg.ko{color:#ff9aa5}.amsg.ok{color:var(--win)}
.lb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.lb td,.lb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.lb th{font-weight:600;color:var(--paper-dim);font-size:12px}
.lb td:nth-child(n+3),.lb th:nth-child(n+3){text-align:right}
.lb tr.me td{color:var(--gold-hi);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
/* ---------- contour fin et lumineux, nom en belle écriture ---------- */
.card{padding:0;border-radius:4.5cqw;background:#0b0e1c;
  box-shadow:0 3cqw 7cqw rgba(0,0,0,.55),0 1cqw 2cqw rgba(0,0,0,.35)}
.card .in{border-radius:4.5cqw}
.card:after{content:"";position:absolute;inset:0;z-index:4;border-radius:4.5cqw;pointer-events:none;
  border:max(1px,.5cqw) solid rgba(255,255,255,.78);box-shadow:inset 0 0 3cqw rgba(255,255,255,.22)}
.nm{font-family:"Cinzel",var(--f-title);font-weight:700;font-size:8.6cqw;letter-spacing:.04em;line-height:1.12;text-align:center;
  color:#fff7e6;text-shadow:0 .5cqw 2.5cqw rgba(0,0,0,.85),0 0 5cqw rgba(0,0,0,.5)}
.card.mini .nm{font-size:10.5cqw;letter-spacing:.02em}
.card.fa .txt{padding:22cqw 5cqw 6cqw;background:linear-gradient(transparent,rgba(7,10,22,.45) 40%,rgba(7,10,22,.8))}
/* ---------- ergonomie mobile et PC ---------- */
.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 12px}
.grid>button .card{transition:transform .18s ease,box-shadow .18s ease}
@media (hover:hover){.grid>button:not(:disabled):hover .card{transform:translateY(-4px) scale(1.02)}}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
nav button{min-height:54px}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.search{flex:1;min-width:0;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--ink-2);color:var(--paper);padding:0 16px;font:inherit;font-size:16px}
.search::placeholder{color:var(--paper-dim)}
.chip small{opacity:.7;margin-left:4px;font-size:11px}
.empty-q{color:var(--paper-dim);text-align:center;padding:24px 0}
@media (min-width:900px){
  .app{max-width:1180px}
  header{padding:18px 28px 10px}
  .logo{font-size:30px}
  main{order:2}
  nav{order:1;grid-template-columns:repeat(5,minmax(0,150px));justify-content:center;border-top:0;border-bottom:1px solid var(--line);background:none;padding:0}
  nav button[aria-current="true"]{box-shadow:inset 0 -2px 0 var(--gold)}
  main{padding:16px 28px 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
  .packs{flex-wrap:wrap;overflow:visible;margin:0 0 16px;padding:0}
  .lead{font-size:15px;max-width:70ch}
  .toast{bottom:32px}
}
/* ---------- duel chaîne alimentaire et marché ---------- */
.dgrid>button{padding-bottom:22px}
.dbadge{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:center;gap:5px;white-space:nowrap;background:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:13px;line-height:1.3}
.dbadge b{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--gold-hi)}
.dbadge i{font-style:normal;font-size:12px;color:var(--paper-dim)}
.dgrid>button:disabled{opacity:.45;cursor:not-allowed}
.dgrid>button.sel .card,.grid>button.pick .card{box-shadow:0 0 0 3px var(--gold-hi),0 12px 24px rgba(0,0,0,.6);transform:translateY(-6px)}
.cyc{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px;margin:6px 0 10px;font-size:13px}
.cyc span{background:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.cyc i{font-style:normal;color:var(--gold)}
.h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:14px 0 8px}
.nrg{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--paper-dim);margin:0 0 10px}
.nrg b{color:var(--gold-hi);font-size:16px}
.slot .dbadge{position:static;transform:none}
.slot{position:relative}
.ls{display:grid;grid-template-columns:72px 1fr;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lsc{background:none;border:0;padding:0;cursor:pointer;grid-row:span 2}
.inf{display:grid;gap:2px;font-size:13px;color:var(--paper-dim);min-width:0}
.inf b{color:var(--paper)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.buy{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--ink-2));color:var(--paper);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:38px}
.buy:disabled{opacity:.5;cursor:default}
.sellbox{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--ink-2);margin:0 0 16px}
.sbr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0}
.sbr span{width:52px;font-size:13px;color:var(--paper-dim)}
.tr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tr small{display:block;color:var(--paper-dim);font-size:13px;margin-top:2px}
@media (min-width:900px){.ls{grid-template-columns:90px 1fr auto}.lsc{grid-row:auto}}
/* ================= graphisme v2 ================= */
body{background:#0b0e1f}
.app{background:
  radial-gradient(60% 40% at 15% 0%,rgba(80,110,220,.22),transparent 70%),
  radial-gradient(50% 35% at 90% 10%,rgba(216,171,76,.14),transparent 70%),
  radial-gradient(70% 50% at 50% 110%,rgba(60,160,140,.16),transparent 70%),
  linear-gradient(#141936,#0c1024)}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 32%,#fff6,transparent),radial-gradient(1.5px 1.5px at 38% 62%,#fff5,transparent),radial-gradient(1px 1px at 85% 78%,#fff7,transparent),radial-gradient(1px 1px at 22% 88%,#fff5,transparent),radial-gradient(1.2px 1.2px at 58% 8%,#fff6,transparent)}
header{position:relative;z-index:2}
main{position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;font-family:"Cinzel",var(--f-display);font-weight:700;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff1c7,#d8ab4c);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{-webkit-text-fill-color:var(--paper-dim);font-family:var(--f-body);font-weight:400;letter-spacing:0}
.logo>div{white-space:nowrap;font-size:21px;line-height:1.1}
.logo small{white-space:nowrap}
@media (min-width:900px){.logo>div{font-size:30px}}
.leaf{width:30px;height:30px;flex:none;fill:none;stroke:var(--gold-hi);stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(243,213,140,.45))}
.hr{gap:6px}
.pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(243,213,140,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.pill i{font-style:normal;font-size:14px}
.pill b{font-family:"Cinzel",serif;font-size:15px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.acb{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
h2{font-family:"Cinzel",var(--f-display);font-weight:700;letter-spacing:.04em;font-size:21px;margin:14px 0 4px;
  background:linear-gradient(180deg,#fff4d6,#e4bf6a);-webkit-background-clip:text;background-clip:text;color:transparent}
h2:after{content:"";display:block;width:46px;height:2px;margin-top:6px;border-radius:2px;background:linear-gradient(90deg,var(--gold),transparent)}
nav{position:relative;z-index:2;background:rgba(14,18,40,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(243,213,140,.18)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-body);font-size:12px;letter-spacing:.02em;position:relative}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--gold-hi);box-shadow:none}
nav button[aria-current="true"] svg{filter:drop-shadow(0 0 6px rgba(243,213,140,.6))}
nav button[aria-current="true"]:before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold-hi);box-shadow:0 0 12px var(--gold)}
.btn{background:linear-gradient(180deg,#ffe7a8,#e0b354 55%,#c8942f);border-color:#f3d58c;box-shadow:0 6px 18px rgba(216,171,76,.28),inset 0 1px 0 rgba(255,255,255,.6);letter-spacing:.02em;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.2);box-shadow:none;color:var(--paper)}
.chip{background:rgba(255,255,255,.04);display:inline-flex;align-items:center;gap:6px}
.chip[style*="--pc"]:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc);box-shadow:0 0 6px var(--pc)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#fff3d1,#e9cf8f);color:#20160a;border-color:transparent}
.search{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
.prog{position:relative;height:16px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.prog i{border-radius:99px;box-shadow:0 0 12px rgba(243,213,140,.5)}
.prog span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.seg{display:inline-flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);margin:0 0 12px}
.seg button{border:0;background:none;color:var(--paper-dim);padding:7px 14px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600}
.miss{border:1px solid rgba(255,255,255,.08);background:radial-gradient(90% 70% at 50% 35%,color-mix(in srgb,var(--pc,#555) 30%,transparent),rgba(255,255,255,.02));border-radius:12px}
.miss b{color:rgba(255,255,255,.22)}
.cnt{background:linear-gradient(180deg,#ffe7a8,#d8ab4c);box-shadow:0 2px 8px rgba(0,0,0,.6)}
.sachet{box-shadow:0 0 0 1.5px rgba(243,213,140,.8),0 0 60px rgba(216,171,76,.25),0 24px 50px rgba(0,0,0,.6);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.timer{font-size:14px}
.ls,.tr{border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.035);padding:10px 12px;margin-bottom:10px}
.rules,.sellbox{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.1)}
.arena{background:radial-gradient(80% 90% at 50% 50%,rgba(216,171,76,.16),transparent 70%),rgba(255,255,255,.04);border-color:rgba(243,213,140,.2)}
.vact{display:grid;gap:10px;text-align:center;color:var(--paper);font-size:13.5px}
#view{background:rgba(6,8,20,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){.sachet{animation:none}}
.cd.hot{color:#ff9aa5;font-weight:700}
.specs,.noirs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.spk,.noir{position:relative;display:grid;gap:4px;text-align:left;padding:16px;border-radius:18px;border:1px solid rgba(243,213,140,.35);color:var(--paper);cursor:pointer;font:inherit;overflow:hidden;
  background:linear-gradient(140deg,#3a2a6b,#16183a 60%,#3b1f3a);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.spk-legende{background:linear-gradient(140deg,#6b4f17,#1d1730 60%,#5a3b12)}.spk-disparus{background:linear-gradient(140deg,#3d4a3a,#14192a 60%,#4a3524)}
.spk b,.noir>b{font-family:"Cinzel",serif;font-size:17px;color:var(--gold-hi)}
.spk small,.noir small{color:var(--paper-dim)}
.spk span{justify-self:start;margin-top:6px;padding:6px 14px;border-radius:99px;background:linear-gradient(180deg,#ffe7a8,#d8ab4c);color:#2a1d06;font-weight:700;font-size:13px}
.noir{cursor:default}.noir .buy{justify-self:start;margin-top:6px}
.noirst{text-align:center;margin:0 0 14px;padding:10px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);font-size:14px}
.binders{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.binder{display:grid;gap:8px;padding:10px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid color-mix(in srgb,var(--pc) 45%,transparent)}
.bcov{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--pc) 60%,#000),#0b0e1f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.bcov img{width:100%;height:100%;object-fit:cover;opacity:.85}
.bcov span{position:absolute;left:0;right:0;bottom:0;padding:24px 8px 8px;font-family:"Cinzel",serif;font-weight:700;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.binf{display:grid;gap:6px;font-size:13px}.binf small{color:var(--paper-dim)}.binf .prog{margin:0;height:8px}
#suc{position:fixed;inset:0;z-index:25;background:rgba(6,8,20,.95);display:grid;place-items:start center;overflow-y:auto;padding:20px 16px}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sucl{display:grid;gap:10px;margin-top:10px}
.suci{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.suci.ok{border-color:rgba(243,213,140,.45)}.suci.got{opacity:.6}
.suci>i{font-style:normal;font-size:24px;text-align:center}.suci small{display:block;color:var(--paper-dim);font-size:12px}
.suci .prog{height:6px;margin:4px 0 0}

/* description, sous-titre et stats (Puissance, Vitesse, Intelligence sur 10) ; coût de 1 à 10 tiré surtout de la meilleure stat */
const DESC={"vaquita":["Mammifère marin","Plus petit marsouin du monde, le vaquita vit uniquement dans le nord du golfe de Californie, au Mexique. Discret et timide, il fuit les bateaux et chasse seul ou en petits groupes poissons et calmars près du fond. Pris accidentellement dans les filets de pêche illégale, il ne compterait plus qu’une dizaine d’individus, ce qui en fait le mammifère marin le plus menacé de la planète.",[2,5,6]],"ornithorynque":["Mammifère ovipare","Avec son bec de canard, sa queue de castor et ses pattes palmées, l’ornithorynque vit dans les rivières de l’est de l’Australie. Il plonge les yeux fermés et repère ses proies grâce aux capteurs électriques de son bec. C’est l’un des rares mammifères qui pondent des œufs, et le mâle porte aux pattes arrière un ergot venimeux capable de provoquer une douleur intense.",[2,3,4]],"baleine":["Mammifère marin","Géante acrobate des océans, la baleine à bosse parcourt chaque année des milliers de kilomètres entre ses zones de nourrissage froides et ses eaux tropicales de reproduction. Elle se nourrit de krill et de petits poissons, parfois en les piégeant dans un filet de bulles. Les mâles chantent de longues mélodies complexes qui évoluent d’une année sur l’autre et se transmettent entre groupes.",[9,5,8]],"tardigrade":["Micro-animal","Minuscule animal de moins d’un millimètre, le tardigrade vit dans les mousses, les lichens, les sols et les eaux du monde entier. Surnommé « ourson d’eau », il avance lentement sur huit pattes munies de griffes. Face au danger, il se dessèche et entre dans une sorte de vie suspendue qui lui permet de supporter le froid extrême, les radiations et même le vide spatial.",[1,1,1]],"herisson":["Petit mammifère","Petit insectivore des jardins, des haies et des lisières de forêt, le hérisson sort surtout la nuit pour chasser vers, limaces et insectes. Son dos est couvert de milliers de piquants : menacé, il se roule en boule hérissée presque impossible à attaquer. Il hiberne pendant l’hiver et résiste en partie au venin de vipère, ce qui lui permet parfois de s’attaquer à ces serpents.",[2,3,4]],"saola":["Bovidé forestier","Surnommé la « licorne d’Asie », le saola vit caché dans les forêts de montagne humides entre le Laos et le Vietnam. Il n’a été découvert par les scientifiques qu’en 1992, et très peu de personnes l’ont vu vivant. Il porte deux longues cornes presque droites et broute feuilles et plantes près des ruisseaux. Le braconnage et les pièges en font l’un des mammifères les plus menacés au monde.",[5,5,4]],"grandrequinblanc":["Requin prédateur","Super-prédateur des mers tempérées, le grand requin blanc patrouille près des côtes riches en phoques et en otaries. Il attaque souvent par en dessous, à grande vitesse, au point de bondir parfois hors de l’eau. Ses sens sont redoutables, notamment son odorat et sa détection des champs électriques. Ses dents triangulaires tombent et se renouvellent sans cesse : il en use des milliers dans sa vie.",[9,8,5]],"kakapo":["Perroquet nocturne","Gros perroquet de Nouvelle-Zélande au plumage vert mousse, le kakapo est le seul perroquet incapable de voler. Il vit la nuit et grimpe aux arbres, puis se laisse planer vers le sol avec ses ailes courtes. Face au danger, il s’immobilise, une défense inutile contre les chats et les rats introduits. Presque disparu, il est aujourd’hui protégé sur des îles sans prédateurs, chaque oiseau étant suivi de près.",[2,2,6]],"baleinebleue":["Mammifère marin","Avec plus de 30 mètres de long, la baleine bleue est le plus gros animal ayant jamais existé, plus grande que n’importe quel dinosaure. Elle filtre l’eau de mer grâce à ses fanons pour avaler d’énormes quantités de krill. Ses appels très graves peuvent porter à des centaines de kilomètres. Chassée presque jusqu’à l’extinction au XXe siècle, elle est aujourd’hui protégée.",[10,5,7]],"jaguar":["Grand félin","Plus grand félin des Amériques, le jaguar règne sur les forêts tropicales et les marais, de l’Amazonie au Pantanal. Solitaire et puissant, il chasse à l’affût cerfs, pécaris, caïmans et tortues. Contrairement à beaucoup de félins, il adore l’eau et nage très bien. Sa morsure est si forte qu’il tue souvent en perçant le crâne de sa proie, et peut même briser une carapace de tortue.",[8,8,6]],"meduseboite":["Cnidaire venimeux","Transparente et presque invisible dans l’eau, la méduse-boîte vit surtout dans les eaux chaudes du nord de l’Australie et de l’Indo-Pacifique. Contrairement aux autres méduses, elle nage activement et possède des yeux qui l’aident à éviter les obstacles. Ses longs tentacules sont couverts de cellules urticantes : son venin, l’un des plus rapides au monde, peut tuer un humain en quelques minutes.",[8,3,1]],"pygargueateteblanche":["Oiseau de proie","Symbole des États-Unis, le pygargue à tête blanche vit près des lacs, des rivières et des côtes d’Amérique du Nord. Il se nourrit surtout de poissons qu’il saisit en surface avec ses serres, mais vole aussi les proies d’autres oiseaux. Le couple agrandit chaque année le même nid, qui peut dépasser une tonne. Menacé au XXe siècle par les pesticides, il a fait un retour spectaculaire.",[5,8,6]],"bisondeurope":["Grand herbivore","Le bison d’Europe, ou wisent, est le plus lourd animal terrestre d’Europe. Il vit en petits troupeaux dans les forêts mêlées de clairières, où il broute herbes, feuilles et écorces. Disparu à l’état sauvage au début du XXe siècle, il a été sauvé grâce à quelques animaux de zoo. Réintroduit notamment dans la forêt de Białowieża en Pologne, il compte aujourd’hui plusieurs milliers d’individus.",[9,5,4]],"pieuvre":["Céphalopode","Maîtresse du camouflage, la pieuvre change de couleur et de texture en un instant pour se fondre dans les rochers. Sans squelette, elle se faufile dans des trous minuscules et utilise ses huit bras couverts de ventouses pour chasser crabes et coquillages. Très intelligente, elle sait ouvrir des bocaux et résoudre des énigmes. Elle possède trois cœurs et un sang bleu.",[3,5,8]],"anacondavert":["Serpent constricteur","Le plus lourd serpent du monde vit dans les marais et les rivières lentes d’Amérique du Sud. Lent sur la terre ferme, l’anaconda vert est à l’aise dans l’eau, où il attend ses proies, seuls les yeux et les narines dépassant de la surface. Il saisit poissons, oiseaux, capybaras ou même caïmans, puis les étouffe dans ses anneaux avant de les avaler entiers. Il n’est pas venimeux.",[8,3,3]],"chouetteeffraie":["Rapace nocturne","Avec son visage blanc en forme de cœur, la chouette effraie chasse la nuit dans les champs, les prairies et autour des fermes. Son disque facial agit comme une antenne qui dirige les sons vers ses oreilles, placées à des hauteurs différentes. Elle peut ainsi repérer et attraper une souris dans le noir complet. Ses plumes spéciales rendent son vol presque totalement silencieux.",[2,6,5]],"tortuegeantedesgalapagos":["Tortue terrestre","Présente uniquement sur les îles Galápagos, au large de l’Équateur, cette tortue géante peut dépasser 200 kilos. Elle broute herbes, feuilles et cactus, et peut rester longtemps sans boire ni manger. Elle passe ses journées à se reposer au soleil ou dans des mares boueuses. Elle peut vivre plus de 100 ans. Ses différentes formes selon les îles ont aidé Charles Darwin à réfléchir à l’évolution.",[5,1,3]],"petitpingouin":["Oiseau marin","Oiseau noir et blanc de l’Atlantique Nord, le petit pingouin niche en colonies sur les falaises, des côtes bretonnes jusqu’à l’Islande. Contrairement aux manchots, il vole très bien, en battant rapidement ses ailes courtes. Excellent plongeur, il utilise aussi ses ailes pour « voler » sous l’eau et attraper de petits poissons. C’est le plus proche parent encore vivant du grand pingouin disparu.",[1,6,4]],"autruche":["Oiseau coureur","Plus gros oiseau du monde, l’autruche vit dans les savanes et les zones sèches d’Afrique. Incapable de voler, elle court à environ 70 km/h sur ses longues pattes à deux doigts. Elle mange surtout des plantes, mais aussi des insectes. Ses coups de patte, armés d’une forte griffe, peuvent blesser gravement un prédateur. Elle pond les plus gros œufs de tous les oiseaux vivants.",[6,9,3]],"macareuxmoine":["Oiseau marin","Avec son bec orange et rayé, le macareux moine est surnommé le « perroquet des mers ». Il passe l’hiver en pleine mer et revient au printemps nicher en colonies sur les falaises de l’Atlantique Nord, dans des terriers. Excellent plongeur, il chasse de petits poissons et peut en tenir plus de dix dans son bec à la fois, grâce à sa langue et aux petites pointes de son palais.",[1,6,4]],"sanglier":["Mammifère forestier","Ancêtre du cochon domestique, le sanglier vit dans les forêts et les campagnes d’Europe et d’Asie. Les femelles et leurs petits, les marcassins rayés, vivent en groupes appelés compagnies, tandis que les vieux mâles sont souvent solitaires. Omnivore, il fouille le sol avec son groin puissant pour trouver racines, glands et vers. Le mâle possède des défenses tranchantes redoutables.",[6,6,5]],"corbeaufreux":["Corvidé","Reconnaissable à la peau grise et nue à la base de son bec, le corbeau freux vit dans les champs et les prairies d’Europe. Très sociable, il niche en grandes colonies bruyantes au sommet des arbres, appelées corbeautières. Il mange insectes, vers et graines. En captivité, il a montré qu’il sait utiliser et même fabriquer des outils, et résoudre des problèmes étonnamment complexes.",[2,6,9]],"lievre":["Mammifère coureur","Plus grand et plus élancé que le lapin, le lièvre vit dans les champs, les prairies et les lisières de forêt. Il ne creuse pas de terrier : il se cache dans un simple creux du sol, le gîte. Ses levrauts naissent couverts de poils et les yeux ouverts. Menacé, il s’enfuit en bonds rapides et en zigzags, pouvant dépasser 70 km/h. Au printemps, les lièvres se « boxent » debout.",[1,9,3]],"fourmirousse":["Insecte social","La fourmi rousse construit dans les forêts de conifères de grands dômes d’aiguilles de pin qui peuvent abriter des centaines de milliers d’ouvrières. Chaque colonie compte plusieurs reines et des ouvrières qui se partagent les tâches. Grande chasseuse d’insectes, elle aide à protéger les forêts. Pour se défendre, elle projette de l’acide formique avec son abdomen.",[1,3,4]],"heroncendre":["Échassier","Grand oiseau gris aux longues pattes, le héron cendré fréquente les rivières, les étangs et les marais d’Europe, d’Asie et d’Afrique. Patient, il reste immobile au bord de l’eau, puis détend son long cou d’un coup pour harponner un poisson avec son bec pointu. Il mange aussi grenouilles et petits rongeurs. En vol, il replie son cou en S, ce qui le distingue des grues et des cigognes.",[2,5,5]],"goldenretriever":["Chien rapporteur","Le golden retriever est né en Écosse au XIXe siècle, pour rapporter le gibier tombé dans l’eau ou dans les marais. Il nage très bien et possède une gueule « douce » qui ne blesse pas l’oiseau. Doux, patient et très attaché à sa famille, il adore jouer et apprendre. Ces qualités en font l’un des meilleurs chiens guides d’aveugles, chiens d’assistance et chiens de famille.",[4,7,8]],"caniche":["Chien de compagnie","Avant de devenir un chien de salon, le caniche était un chien de chasse chargé de rapporter le gibier d’eau, notamment les canards. Sa toison bouclée le protégeait du froid, et sa coupe traditionnelle servait à garder ses articulations au chaud. Très populaire en France, il existe en plusieurs tailles. Intelligent et facile à dresser, il a longtemps brillé dans les cirques.",[2,6,9]],"dalmatien":["Chien de race","Célèbre pour sa robe blanche à taches noires ou brunes, le dalmatien tient son nom de la Dalmatie, sur la côte croate. Endurant, il était autrefois chargé de courir à côté des calèches pour les escorter et calmer les chevaux. Aux États-Unis, il est devenu la mascotte des pompiers. Ses chiots naissent tout blancs, les taches n’apparaissant qu’après quelques semaines.",[4,8,6]],"huskysiberien":["Chien de traîneau","Le husky sibérien vient du peuple Tchouktche, en Sibérie, qui l’utilisait pour tirer des traîneaux sur de longues distances dans le froid extrême. Son épaisse double fourrure le protège à des températures très basses, et ses yeux sont souvent bleus. Très endurant, il peut courir des dizaines de kilomètres par jour. Joueur, sociable et indépendant, il aime hurler plus qu’aboyer.",[5,8,6]],"bouvierbernois":["Chien de ferme","Originaire de la région de Berne, en Suisse, le bouvier bernois aidait les paysans à garder les troupeaux et tirait les petites charrettes de lait jusqu’aux fromageries. Sa robe tricolore noire, rouille et blanche est épaisse et longue. Grand, robuste et calme, il est doux avec les enfants et très attaché à sa famille. Sa grande taille lui donne malheureusement une vie assez courte.",[6,5,6]],"basenji":["Chien primitif","Originaire d’Afrique centrale, le basenji aidait les chasseurs à rabattre le gibier dans la forêt. Il compte parmi les races de chiens les plus anciennes. Il n’aboie presque jamais : il émet plutôt un son étrange, entre le chant et le jodel. Propre, il se lave un peu comme un chat. Vif, curieux et indépendant, il est intelligent mais pas toujours très obéissant.",[3,8,7]],"chiendesainthubert":["Chien de chasse","Le chien de Saint-Hubert a été sélectionné au Moyen Âge par des moines de l’abbaye de Saint-Hubert, dans les Ardennes belges. Ses longues oreilles et sa peau plissée l’aident à ramener les odeurs vers sa truffe. Son flair est l’un des meilleurs du monde canin : il peut suivre une piste vieille de plusieurs jours. Doux et têtu, il aide la police à retrouver des personnes disparues.",[5,5,6]],"britishshorthair":["Chat de race","Le british shorthair descend des chats de ferme et de rue de Grande-Bretagne, appréciés pour chasser les souris. Sélectionné au XIXe siècle, il est l’une des plus anciennes races anglaises. Son corps trapu, sa tête ronde et son pelage très dense, souvent gris-bleu, lui donnent l’allure d’un ours en peluche. Calme et indépendant, il est affectueux sans être collant.",[2,4,5]],"bengal":["Chat de race","Le bengal est né aux États-Unis dans les années 1970-1980, en croisant des chats domestiques avec le chat-léopard d’Asie, un petit félin sauvage. Il en a gardé une robe tachetée ou marbrée qui rappelle celle du léopard. Musclé et très athlétique, il adore grimper, jouer et même l’eau. Curieux et très actif, il a besoin de beaucoup d’occupations pour ne pas s’ennuyer.",[2,6,6]],"chartreux":["Chat de race","Race française ancienne, le chartreux est célèbre pour son pelage gris-bleu épais et laineux et ses yeux cuivrés ou orangés. Longtemps apprécié pour chasser les rongeurs dans les fermes, il a été sauvé et sélectionné au XXe siècle par des éleveurs passionnés. Robuste et musclé, il est calme, discret et très attaché à ses maîtres. Il miaule peu et préfère de petits cris doux.",[2,4,6]],"korat":["Chat de race","Originaire de Thaïlande, le korat est l’une des plus anciennes races de chats, décrite dans de vieux manuscrits thaïs. Son pelage gris-bleu aux pointes argentées brille à la lumière, et ses yeux sont d’un vert intense. En Thaïlande, on l’offre comme porte-bonheur, notamment aux jeunes mariés. Affectueux et vif, il s’attache fortement à sa famille et aime peu le bruit.",[2,5,6]],"dodo":["Oiseau disparu","Le dodo vivait uniquement sur l’île Maurice, dans l’océan Indien. Sans prédateur, ce gros oiseau cousin des pigeons avait perdu la capacité de voler et nichait au sol. L’arrivée des marins européens au XVIe siècle lui a été fatale : chasse, destruction de la forêt et animaux introduits comme les rats, les cochons et les singes, qui mangeaient ses œufs. Il a disparu à la fin des années 1600.",[2,2,3]],"aurochs":["Bovin disparu","Ancêtre sauvage de nos vaches, l’aurochs était un immense bœuf aux longues cornes recourbées, peint sur les parois de la grotte de Lascaux. Il vivait dans les forêts et les plaines d’Europe, d’Asie et d’Afrique du Nord. La chasse et la disparition de son habitat l’ont fait reculer peu à peu. Le dernier aurochs connu, une femelle, est mort en 1627 dans une forêt de Pologne.",[9,6,4]],"grandpingouin":["Oiseau disparu","Grand oiseau noir et blanc de l’Atlantique Nord, le grand pingouin ne volait pas, mais nageait et plongeait remarquablement. Il ne venait à terre que pour pondre, sur quelques îles rocheuses. Maladroit sur le sol, il était facile à capturer : les marins l’ont massacré pour sa viande, ses œufs et ses plumes. Les deux derniers connus ont été tués en 1844, sur un îlot au large de l’Islande.",[2,5,3]],"aigledehaast":["Rapace disparu","Le plus grand aigle connu vivait en Nouvelle-Zélande, il y a encore quelques siècles. L’aigle de Haast chassait les moas, de grands oiseaux sans ailes bien plus lourds que lui, en les frappant avec ses énormes serres. Super-prédateur des forêts, il n’avait aucun ennemi. Quand les Maoris sont arrivés vers 1300 et ont chassé les moas jusqu’à leur extinction, l’aigle a disparu avec eux.",[7,8,5]],"cerfgeantmegaceros":["Cervidé préhistorique","Le mégacéros, ou cerf géant, vivait dans les plaines d’Europe et d’Asie pendant la dernière période glaciaire. Plus grand qu’un élan, le mâle portait les plus grands bois connus chez un cerf, qui pouvaient atteindre 3,6 mètres d’envergure. Il les perdait et les refaisait chaque année. Il a disparu il y a environ 7 700 ans en Sibérie, sans doute à cause du changement de climat et de la chasse.",[8,6,4]],"glyptodon":["Mammifère préhistorique","Le glyptodon était un cousin géant des tatous qui vivait en Amérique du Sud. Son corps était protégé par une énorme carapace bombée faite de centaines de plaques osseuses, grande comme une petite voiture. Herbivore, il broutait les plantes des prairies. Il a disparu il y a environ 10 000 ans, à la fin de la dernière glaciation, sans doute à cause du climat et de la chasse par les humains.",[7,1,2]],"triceratops":["Dinosaure herbivore","Le tricératops vivait en Amérique du Nord à la toute fin du Crétacé, il y a environ 68 à 66 millions d’années. Ce grand herbivore portait trois cornes sur la tête et une large collerette osseuse qui pouvait dépasser un mètre. Ses cornes lui servaient sans doute à se défendre contre le tyrannosaure et à impressionner ses rivaux. Il a disparu lors de l’extinction des dinosaures.",[9,4,2]],"paon":["Oiseau d’ornement","Originaire d’Inde et du Sri Lanka, le paon bleu vit dans les forêts claires et près des villages. Seul le mâle porte la célèbre traîne couverte d’« yeux » aux reflets bleus et verts. Pour séduire les femelles, il la redresse en roue et la fait vibrer. Malgré son poids, il peut voler pour dormir en hauteur dans les arbres. Son cri puissant sert d’alerte quand un prédateur approche.",[2,5,4]],"megalodon":["Requin préhistorique","Le mégalodon était le plus grand requin connu, sans doute plus de 15 mètres de long. Il a régné sur les océans chauds du monde il y a environ 23 à 3,6 millions d’années. On le connaît surtout par ses dents fossiles, plus grandes qu’une main. Il chassait de grandes proies, dont des baleines. Le refroidissement des océans et la concurrence d’autres prédateurs ont sans doute causé sa disparition.",[10,7,4]],"fennec":["Petit renard","Plus petit renard du monde, le fennec vit dans les dunes du Sahara et d’Afrique du Nord. Ses immenses oreilles l’aident à évacuer la chaleur et à entendre les insectes et rongeurs sous le sable. Actif surtout la nuit, il passe la journée dans un terrier frais. Ses pattes couvertes de poils le protègent du sable brûlant, et il peut survivre longtemps sans boire.",[1,6,5]],"toucan":["Oiseau tropical","Reconnaissable entre tous, le toucan vit dans les forêts tropicales d’Amérique du Sud et centrale. Son énorme bec coloré est très léger, car il est creux et renforcé de fines travées. Il s’en sert pour cueillir des fruits au bout des branches et, grâce à ses nombreux vaisseaux sanguins, pour évacuer la chaleur. Bruyant et sociable, il vit en petits groupes et niche dans des trous d’arbres.",[2,5,5]],"tapir":["Mammifère forestier","Le tapir vit dans les forêts tropicales d’Amérique et d’Asie du Sud-Est. Malgré son allure de cochon, il est plus proche des chevaux et des rhinocéros. Son nez et sa lèvre forment une petite trompe mobile qui saisit feuilles et fruits. Excellent nageur, il se réfugie dans l’eau en cas de danger. Ses petits ont un pelage rayé et tacheté qui les camoufle au sol de la forêt.",[6,4,4]],"narval":["Mammifère marin","Surnommé la « licorne des mers », le narval vit dans les eaux glacées de l’Arctique, souvent près de la banquise. Sa célèbre « corne » est en réalité une dent qui traverse sa lèvre et peut dépasser 2 mètres, surtout chez les mâles. Elle contient des millions de terminaisons nerveuses. Excellent plongeur, il descend très profond pour chasser poissons et calmars, et vit en groupes.",[6,6,7]],"diabledetasmanie":["Marsupial carnivore","Le diable de Tasmanie est le plus grand marsupial carnivore encore vivant. Il ne vit plus que sur l’île de Tasmanie, au sud de l’Australie. Actif la nuit, il se nourrit surtout de carcasses, qu’il dévore entièrement, os et peau compris. Sa morsure est l’une des plus puissantes pour sa taille, et ses cris terrifiants lui ont donné son nom. Une maladie contagieuse menace l’espèce.",[4,5,4]],"kiwi":["Oiseau coureur","Emblème de la Nouvelle-Zélande, le kiwi est un oiseau incapable de voler, aux ailes minuscules cachées sous des plumes qui ressemblent à des poils. Actif la nuit, il fouille le sol à la recherche de vers et d’insectes. Ses narines placées au bout du long bec lui permettent de les sentir sous terre. La femelle pond un œuf énorme par rapport à sa taille.",[2,4,4]],"calamar":["Céphalopode géant","Habitant mystérieux des grandes profondeurs, le calamar géant peut dépasser 10 m de long avec ses tentacules. Ses yeux, grands comme des assiettes, sont parmi les plus gros du règne animal et l'aident à repérer ses prédateurs dans l'obscurité. Longtemps connu par des carcasses échouées, il n'a été photographié vivant dans son milieu qu'en 2004. Le cachalot est son principal ennemi.",[6,5,6]],"komodo":["Grand lézard","Plus grand lézard du monde, le dragon de Komodo vit sur quelques îles d'Indonésie et peut dépasser 2,5 m de long. Ce prédateur patient guette cerfs et sangliers au bord des sentiers, puis les attaque par surprise. Sa morsure, munie de glandes à venin, empêche le sang de coaguler et affaiblit la proie. Grâce à sa langue fourchue, il détecte l'odeur d'une carcasse à plusieurs kilomètres.",[7,4,4]],"orque":["Mammifère marin","Prédateur emblématique des océans froids, l'orque vit en groupes familiaux soudés appelés pods. Très intelligente, elle communique par sons complexes, coopère pour chasser et transmet ses techniques aux plus jeunes. Rapide, endurante et extrêmement adaptable, elle peut capturer poissons, phoques et autres proies selon son environnement.",[9,8,9]],"meduse":["Cnidaire marin","Minuscule méduse de quelques millimètres, Turritopsis dohrnii vit dans les mers tempérées et tropicales. Lorsqu'elle est blessée, stressée ou vieillissante, elle peut transformer ses cellules et redevenir un polype, son stade de jeunesse. Elle recommence alors sa vie à zéro, un cycle qui pourrait en théorie se répéter sans fin. Dans la nature, elle reste pourtant la proie de nombreux animaux.",[1,1,1]],"renard":["Petit canidé","Présent sur presque tout l'hémisphère Nord, le renard roux s'adapte aussi bien aux forêts qu'aux champs et même aux grandes villes. Surtout actif au crépuscule et la nuit, il se nourrit de rongeurs, d'insectes, de fruits et de restes. Son ouïe est si fine qu'il entend une souris sous la neige, puis bondit en l'air pour plonger museau en avant sur sa proie.",[3,7,7]],"lion":["Grand félin","Seul félin vraiment social, le lion vit en groupes appelés troupes, dans les savanes d'Afrique et une forêt d'Inde. Les lionnes chassent souvent ensemble zèbres, gnous ou buffles, tandis que les mâles défendent le territoire. Son rugissement puissant s'entend jusqu'à environ 8 km et sert à prévenir les rivaux. Il passe pourtant jusqu'à 20 heures par jour à se reposer.",[9,8,6]],"rhinocerosdejava":["Grand herbivore","Le rhinocéros de Java est l'un des grands mammifères les plus rares de la planète. Il en reste moins de 100, tous réfugiés dans le parc national d'Ujung Kulon, à l'ouest de l'île de Java, en Indonésie. Solitaire et discret, il vit dans la forêt tropicale humide, se nourrit de feuilles et de jeunes pousses et adore se rouler dans la boue. Il ne porte qu'une seule petite corne.",[9,4,4]],"requindugroenland":["Requin des abysses","Habitant des eaux glaciales de l'Arctique et de l'Atlantique Nord, le requin du Groenland nage très lentement dans l'obscurité des profondeurs. Il grandit d'environ un centimètre par an seulement, ce qui explique sa longévité exceptionnelle. Il peut vivre environ 400 ans, un record chez les vertébrés. Les femelles ne seraient adultes qu'après plus d'un siècle.",[6,1,3]],"ayeaye":["Lémurien nocturne","Étrange lémurien des forêts de Madagascar, l'aye-aye sort la nuit et passe ses journées caché dans un nid de feuilles. Il tapote le bois avec son long doigt très fin et écoute avec ses grandes oreilles l'écho des galeries de larves. Il ronge alors l'écorce avec ses incisives et attrape les insectes avec ce même doigt. Certaines légendes locales le disent porteur de malheur.",[2,4,7]],"pandageant":["Ours herbivore","Symbole de la protection de la nature, le panda géant vit dans les forêts de montagne du centre de la Chine. Bien qu'il appartienne aux carnivores, il se nourrit presque uniquement de bambou, qui l'oblige à manger plus de la moitié de la journée. Un os du poignet transformé lui sert de faux pouce pour saisir les tiges. Grâce aux efforts de conservation, il n'est plus classé en danger.",[6,3,5]],"oursgrizzli":["Grand ours","Le grizzli parcourt les montagnes et forêts de l'ouest de l'Amérique du Nord. Malgré sa masse, il peut courir à plus de 50 km/h sur une courte distance. Omnivore, il dévore baies, racines et insectes, et pêche les saumons qui remontent les rivières. Avant l'hiver, il accumule d'épaisses réserves de graisse puis hiberne plusieurs mois dans une tanière creusée à flanc de colline.",[9,7,7]],"grenouilledoree":["Amphibien venimeux","Petite grenouille jaune vif des forêts humides de Colombie, la grenouille dorée est l'un des animaux les plus toxiques au monde. Sa peau contient assez de poison pour tuer dix humains, et sa couleur éclatante avertit les prédateurs du danger. Des peuples autochtones frottaient la pointe de leurs fléchettes de chasse sur son dos. En captivité, sans son alimentation naturelle, elle perd sa toxicité.",[4,3,2]],"hippopotame":["Mammifère semi-aquatique","L'hippopotame passe ses journées immergé dans les rivières et lacs d'Afrique, puis sort la nuit pour brouter l'herbe des berges. Il peut peser plus de 3 tonnes et ses canines dépassent souvent 50 cm. Très territorial, il compte parmi les animaux les plus dangereux d'Afrique. Sa peau sécrète une sueur rougeâtre qui le protège du soleil et limite les infections.",[9,5,4]],"raiemanta":["Poisson cartilagineux","Géante gracieuse des océans tropicaux, la raie manta océanique peut dépasser 7 m d'envergure. Elle filtre le plancton en nageant la bouche grande ouverte, guidée par deux nageoires repliées en cornes. Elle possède l'un des plus gros cerveaux de tous les poissons et semble reconnaître son reflet. Elle fréquente des stations de nettoyage où de petits poissons la débarrassent de ses parasites.",[5,6,7]],"cameleon":["Lézard arboricole","Le caméléon vit surtout en Afrique et à Madagascar, dans les arbres et les buissons. Ses deux yeux bougent chacun de leur côté, ce qui lui donne une vue presque complète autour de lui. Il capture les insectes avec une langue projectile qui peut dépasser la longueur de son corps. Il change de couleur surtout pour communiquer ses émotions et régler sa température, pas pour se camoufler.",[1,2,3]],"scorpionempereur":["Arachnide venimeux","Le scorpion empereur, l'un des plus grands du monde, vit dans les forêts humides d'Afrique de l'Ouest. Il chasse la nuit insectes et petits animaux, qu'il saisit surtout avec ses grosses pinces. Son venin est faible et rarement dangereux pour l'humain. Sous la lumière ultraviolette, sa carapace brille d'une lueur bleu-vert. La femelle porte ses petits sur son dos pendant plusieurs semaines.",[2,2,2]],"mygale":["Araignée géante","Les mygales forment un groupe de grandes araignées velues vivant surtout dans les régions chaudes. Elles chassent la nuit à l'affût, souvent depuis un terrier tapissé de soie, et attrapent insectes, grenouilles ou petits lézards. Leur venin est généralement peu dangereux pour l'humain. Certaines espèces d'Amérique frottent leur abdomen pour projeter des poils urticants qui irritent leurs ennemis.",[2,3,2]],"piranha":["Poisson carnivore","Le piranha vit dans les rivières d'Amérique du Sud, notamment dans le bassin de l'Amazone. Ses dents triangulaires et tranchantes s'emboîtent comme des ciseaux et lui permettent de découper la chair. Il nage en bancs, surtout pour se protéger de ses propres prédateurs. Malgré sa terrible réputation, il mange aussi des insectes, des graines et des fruits, et attaque rarement les humains.",[3,6,3]],"renardpolaire":["Petit canidé","Le renard polaire vit dans la toundra arctique, autour du pôle Nord. Sa fourrure épaisse, blanche en hiver et brune en été, lui permet de supporter des froids de −50 °C. Ses petites oreilles et son museau court limitent les pertes de chaleur. Il chasse les lemmings sous la neige et suit parfois les ours polaires pour profiter des restes de leurs repas.",[2,7,6]],"loutredemer":["Mammifère marin","La loutre de mer vit le long des côtes du Pacifique Nord, de la Californie au Japon. Elle possède la fourrure la plus dense du monde animal, car elle n'a pas de graisse pour se protéger du froid. Flottant sur le dos, elle casse oursins et coquillages avec une pierre posée sur son ventre. Pour dormir sans dériver, elle s'enroule dans les algues ou se tient la patte avec ses voisines.",[2,5,8]],"ecureuilroux":["Rongeur arboricole","L'écureuil roux bondit agilement de branche en branche dans les forêts d'Europe et d'Asie, aidé par sa longue queue qui lui sert de balancier. À l'automne, il cache des noisettes, des glands et des graines dans le sol pour l'hiver. Il en oublie une partie, qui germent et deviennent des arbres. Il participe ainsi à la régénération des forêts.",[1,6,6]],"mesangecharbonniere":["Petit passereau","Reconnaissable à sa tête noire, ses joues blanches et son ventre jaune, la mésange charbonnière est l'un des oiseaux les plus communs des jardins d'Europe. Très curieuse, elle se nourrit d'insectes, de graines et fréquente volontiers les mangeoires. Au Royaume-Uni, certaines avaient appris à percer les capsules des bouteilles de lait livrées devant les portes pour boire la crème.",[1,6,7]],"coccinelle":["Insecte prédateur","Avec sa carapace rouge à points noirs, la coccinelle à sept points est l'un des insectes les plus connus d'Europe. Ses couleurs vives avertissent les oiseaux qu'elle a mauvais goût. Larve comme adulte, elle chasse les pucerons et peut en manger des milliers au cours de sa vie. Les jardiniers l'apprécient donc comme une alliée naturelle, bien plus utile qu'un insecticide.",[1,3,2]],"lombric":["Ver de terre","Le lombric creuse des galeries dans le sol, qu'il aère et rend plus fertile. Il avale la terre et les feuilles mortes, puis rejette un humus très riche en nutriments pour les plantes. Il n'a ni yeux ni poumons : il respire à travers sa peau, qui doit rester humide. C'est pour cela qu'on le voit sortir après la pluie. Il fait partie des animaux les plus utiles à l'agriculture.",[1,1,1]],"vipereaspic":["Serpent venimeux","La vipère aspic vit dans les zones sèches et ensoleillées de France, de Suisse et d'Italie : talus, lisières et pierriers. On la reconnaît à sa pupille verticale et à son museau légèrement retroussé. Elle chasse surtout les petits rongeurs, qu'elle tue grâce à son venin. Discrète, elle fuit l'humain et ne mord que pour se défendre. Comme les autres serpents de France, elle est protégée.",[4,3,2]],"bergerallemand":["Chien de berger","Créé en Allemagne à la fin du XIXe siècle pour garder les troupeaux, le berger allemand est devenu l'un des chiens de travail les plus polyvalents au monde. Intelligent, courageux et très attaché à son maître, il apprend vite et aime avoir une mission. Il est très utilisé par la police, l'armée et les sauveteurs pour pister, chercher des personnes disparues et guider les aveugles.",[5,7,9]],"teckel":["Chien de chasse","Originaire d'Allemagne, le teckel a été sélectionné pour chasser le blaireau et le renard dans leurs terriers. Ses pattes courtes et son corps allongé l'aidaient à se faufiler dans les galeries souterraines. Courageux, têtu et doté d'un excellent flair, il aboie fort pour sa taille. Il existe en trois types de poil, ras, long ou dur, et en plusieurs tailles.",[2,4,6]],"shibainu":["Chien primitif","Le shiba inu est l'une des plus anciennes races de chiens du Japon, utilisée autrefois pour chasser dans les montagnes boisées. Petit, vif et robuste, il se reconnaît à sa queue enroulée et à son allure de renard. Indépendant et très propre, il a un caractère fier et parfois têtu. Il a frôlé la disparition après la Seconde Guerre mondiale avant d'être sauvé par des éleveurs.",[2,7,6]],"bergerbelgemalinois":["Chien de berger","Né en Belgique, autour de la ville de Malines, le berger belge malinois gardait autrefois les troupeaux. Infatigable, rapide et très obéissant, il est devenu le chien de travail préféré de l'armée et de la police. Il excelle dans la détection d'explosifs, le pistage et la protection. Ce chien plein d'énergie a besoin de beaucoup d'activité physique et mentale chaque jour.",[5,9,9]],"samoyede":["Chien nordique","Le samoyède doit son nom aux Samoyèdes, peuple nomade de Sibérie qui l'utilisait pour garder les rennes, tirer des traîneaux et se réchauffer la nuit. Son épaisse fourrure blanche le protège du froid extrême. Il est célèbre pour son « sourire », les coins de sa bouche relevés. Doux, joyeux et sociable, il adore la compagnie mais n'est pas un bon chien de garde.",[4,6,6]],"bouvierdesflandres":["Chien de bouvier","Originaire des Flandres, entre Belgique et nord de la France, le bouvier des Flandres gardait et conduisait les troupeaux de bœufs. Robuste et puissant, il tirait aussi des charrettes dans les fermes. Pendant la Première Guerre mondiale, il a servi de messager et de chien d'ambulance. Calme, loyal et protecteur, il porte un pelage épais et une barbe caractéristique.",[6,5,7]],"xoloitzcuintle":["Chien sans poils","Le xoloitzcuintle est un chien sans poils du Mexique, déjà connu des Aztèques il y a plusieurs siècles. Son nom vient de Xolotl, un dieu aztèque, et de itzcuintli, qui signifie chien. On croyait qu'il guidait les âmes des morts et que sa peau chaude soulageait les douleurs. Calme, attentif et très attaché à sa famille, il existe en trois tailles.",[3,6,6]],"siamois":["Chat de race","Originaire de l'ancien royaume de Siam, l'actuelle Thaïlande, le siamois était autrefois un chat apprécié des temples et des palais. Ses yeux bleus et son corps clair contrastent avec ses extrémités foncées. Ce sont ses gènes qui font foncer les poils des zones plus froides du corps : pattes, oreilles, queue et visage. Bavard et très affectueux, il miaule souvent pour attirer l'attention.",[2,6,7]],"ragdoll":["Chat de race","Créé en Californie dans les années 1960, le ragdoll est un grand chat aux yeux bleus et au pelage mi-long. Son nom signifie « poupée de chiffon » en anglais, car il se laisse aller tout mou quand on le porte. Très doux et calme, il suit souvent ses maîtres de pièce en pièce, un peu comme un chien. Il s'entend en général bien avec les enfants et les autres animaux.",[2,4,6]],"mauegyptien":["Chat de race","Le mau égyptien est l'une des rares races de chats naturellement tachetés. Il ressemble aux chats représentés sur les fresques de l'Égypte ancienne, même si la race moderne a été fixée au XXe siècle. Ses pattes arrière plus longues et un repli de peau au ventre en font le chat domestique le plus rapide, capable d'atteindre près de 50 km/h. Il est vif, joueur et fidèle.",[2,8,7]],"chatdepallas":["Petit félin sauvage","Le chat de Pallas, ou manul, vit dans les steppes froides et rocheuses d'Asie centrale, jusqu'à plus de 4 000 m d'altitude. Sa fourrure très dense et ses petites oreilles placées bas le protègent du vent glacial. Ses pupilles sont rondes, pas en fente comme chez le chat domestique. Lent et discret, il chasse surtout les pikas à l'affût, caché parmi les rochers.",[2,4,5]],"serval":["Félin sauvage","Le serval vit dans les savanes humides et les zones de hautes herbes d'Afrique. Ses très longues pattes et ses grandes oreilles en font un chasseur de rongeurs redoutable : il les entend même lorsqu'ils se déplacent sous terre. Il bondit alors en l'air pour retomber sur sa proie. Capable de sauter assez haut pour attraper un oiseau en vol, il réussit environ la moitié de ses chasses.",[3,8,5]],"quagga":["Zèbre disparu","Le quagga était une sous-espèce de zèbre des plaines vivant en Afrique du Sud. Il était rayé seulement sur l'avant du corps, l'arrière étant brun uni. Chassé intensivement par les colons pour sa viande et sa peau, et concurrencé par le bétail, il a disparu à la fin du XIXe siècle : le dernier individu est mort au zoo d'Amsterdam en 1883. Un projet tente de recréer son apparence.",[5,8,4]],"mammouthlaineux":["Mammifère disparu","Le mammouth laineux a vécu durant la dernière période glaciaire dans les steppes froides d'Europe, d'Asie et d'Amérique du Nord. Sa toison épaisse et ses longues défenses courbées l'aidaient à survivre au froid et à dégager la neige. Il a disparu sous l'effet du réchauffement du climat et de la chasse humaine. Les derniers vivaient encore il y a environ 4 000 ans, sur l'île Wrangel.",[10,4,8]],"moageant":["Oiseau disparu","Le moa géant vivait en Nouvelle-Zélande, où il n'existait pas de mammifères prédateurs. Incapable de voler et dépourvu d'ailes, il mesurait jusqu'à 3,6 m de haut cou tendu et broutait feuilles et branches. Son seul ennemi naturel était l'aigle de Haast. Les moas ont été chassés jusqu'à l'extinction peu après l'arrivée des Maoris, vers le XVe siècle.",[5,5,3]],"rhinoceroslaineux":["Mammifère disparu","Le rhinocéros laineux vivait pendant les périodes glaciaires dans les steppes froides d'Europe et d'Asie. Couvert d'une épaisse toison, il broutait les herbes basses. Sa corne avant, aplatie, pouvait dépasser 1 m et l'aidait peut-être à dégager la neige. Il a disparu il y a environ 14 000 ans, à cause du changement climatique et peut-être de la chasse. Les humains l'ont peint dans la grotte Chauvet.",[9,5,4]],"stegosaure":["Dinosaure herbivore","Le stégosaure a vécu il y a environ 150 millions d'années, à la fin du Jurassique, en Amérique du Nord et au Portugal. Ce grand herbivore portait une double rangée de plaques osseuses sur le dos. Sa queue armée de quatre longues pointes lui servait à se défendre contre les prédateurs comme l'allosaure. Son cerveau était à peu près de la taille d'une noix.",[8,3,1]],"pteranodon":["Reptile volant","Le ptéranodon a vécu il y a environ 85 millions d'années, au Crétacé, au-dessus d'une mer intérieure qui couvrait l'Amérique du Nord. Ce n'était pas un dinosaure mais un ptérosaure, un reptile volant de 6 m d'envergure. Il planait au-dessus des vagues et attrapait des poissons avec son long bec sans dents. Une grande crête osseuse ornait l'arrière de sa tête.",[4,8,3]],"capybara":["Rongeur géant","Plus gros rongeur du monde, le capybara peut peser plus de 60 kg. Il vit en groupes près des rivières, des lacs et des marais d'Amérique du Sud. Excellent nageur, il possède des pattes légèrement palmées et peut r
