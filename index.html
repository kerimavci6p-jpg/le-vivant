ester plusieurs minutes sous l'eau pour échapper aux jaguars ou aux caïmans. Très calme, il tolère la présence de nombreux autres animaux, parfois installés sur son dos.",[3,5,4]],"titanoboa":["Serpent préhistorique","Le titanoboa a vécu il y a environ 60 millions d'années, juste après la disparition des dinosaures, dans les forêts tropicales chaudes de l'actuelle Colombie. Ce serpent géant d'environ 13 m pesait sans doute plus d'une tonne. Sans venin, il tuait ses proies par constriction, comme les boas actuels. Il chassait probablement poissons et crocodiliens dans les marais.",[10,3,3]],"flamantrose":["Oiseau échassier","Le flamant rose vit en grandes colonies dans les lagunes et lacs salés, notamment en Camargue. Il filtre la vase la tête à l'envers avec son bec courbé pour attraper petits crustacés et algues. Sa couleur rose vient de pigments contenus dans ce qu'il mange : sans eux, il devient blanc. Il dort souvent sur une seule patte, une posture qui l'aide à garder sa chaleur.",[2,6,3]],"quokka":["Marsupial","Petit marsupial de la taille d'un chat, le quokka vit surtout sur l'île Rottnest, au large de l'Australie occidentale. Herbivore et nocturne, il grignote feuilles et herbes et peut tenir longtemps avec peu d'eau. Surnommé l'animal le plus heureux du monde à cause de son sourire, il est devenu une star des réseaux sociaux. Il est pourtant protégé et ne doit pas être nourri.",[1,5,4]],"harfangdesneiges":["Oiseau de proie","Grande chouette blanche de la toundra arctique, le harfang des neiges se camoufle parfaitement dans les paysages enneigés. Ses pattes couvertes de plumes le protègent du froid. Il se nourrit surtout de lemmings, dont il peut avaler plusieurs par jour. Pendant l'été arctique, quand le soleil ne se couche pas, il chasse en plein jour. En hiver, certains descendent vers le sud.",[4,7,6]],"requinmarteau":["Grand requin","Le grand requin-marteau parcourt les eaux tropicales chaudes du monde entier. Sa tête en forme de marteau porte de nombreux capteurs électriques qui l'aident à détecter les proies cachées sous le sable, comme les raies. Elle lui offre aussi un large champ de vision. Certaines espèces se rassemblent en bancs de centaines d'individus autour d'îles volcaniques, comme aux Galápagos.",[7,7,5]],"poulpedumbo":["Céphalopode des abysses","Le poulpe dumbo doit son nom à ses deux nageoires en forme d'oreilles, qui rappellent l'éléphant du dessin animé. Il vit plus profond que presque tous les autres poulpes, parfois à plus de 4 000 m. Il flotte au-dessus du fond en battant de ses nageoires et avale ses proies entières. Contrairement à la plupart des poulpes, il ne possède pas de poche à encre.",[1,2,5]],"requinbaleine":["Requin géant","Plus grand poisson du monde, le requin-baleine peut dépasser 12 m de long. Ce géant paisible des mers tropicales se nourrit pourtant de plancton, de petits poissons et d'œufs qu'il filtre en nageant la bouche grande ouverte. Chaque individu porte un motif unique de taches blanches, qui permet aux scientifiques de le reconnaître. Il parcourt des milliers de kilomètres chaque année.",[7,3,3]],"axolotl":["Amphibien","Salamandre originaire des lacs et canaux de Xochimilco, près de Mexico, l'axolotl garde toute sa vie ses branchies plumeuses de larve. Il possède un pouvoir de régénération exceptionnel : il peut reconstruire une patte, la queue, et même une partie du cœur ou de la moelle épinière. Très menacé dans la nature par la pollution et l'urbanisation, il est pourtant très répandu en aquarium.",[1,2,3]],"guepard":["Félin sprinteur","Champion de vitesse des savanes africaines, le guépard dépasse les 100 km/h en quelques secondes grâce à son corps fin, sa colonne très souple et ses griffes qui accrochent le sol comme des crampons. Il chasse surtout le jour, à vue, et ne tient son sprint que quelques centaines de mètres. Moins puissant que les lions ou les hyènes, il se fait souvent voler ses proies.",[6,10,5]],"cobra":["Serpent venimeux","Le cobra royal vit dans les forêts d'Asie du Sud et du Sud-Est et peut dépasser 5 mètres, ce qui en fait le plus long serpent venimeux du monde. Il se nourrit surtout d'autres serpents, même venimeux. Menacé, il redresse l'avant du corps, déploie sa coiffe et émet un sifflement grave. La femelle est l'un des rares serpents à construire un nid de feuilles pour ses œufs.",[7,4,4]],"kangourou":["Marsupial","Plus grand marsupial vivant, le kangourou roux parcourt les plaines arides d'Australie en petits groupes. Il se déplace par bonds puissants sur ses longues pattes arrière, sa queue lui servant de balancier, et peut dépasser 50 km/h. Les mâles s'affrontent en boxant et en donnant de violents coups de pattes. Le petit, minuscule à la naissance, grandit des mois dans la poche de sa mère.",[6,8,4]],"abeille":["Insecte pollinisateur","L'abeille domestique vit en colonies de plusieurs dizaines de milliers d'individus, organisées autour d'une seule reine. Les ouvrières récoltent nectar et pollen, fabriquent la cire et le miel, et pollinisent au passage de nombreuses plantes cultivées. Pour indiquer une source de nourriture, une butineuse exécute une danse frétillante qui renseigne ses sœurs sur la direction et la distance des fleurs.",[1,5,4]],"tigredesumatra":["Grand félin","Plus petit des tigres encore vivants, le tigre de Sumatra ne vit que sur cette île d'Indonésie, dans les forêts denses et les marais. Ses rayures serrées le camouflent dans la végétation, et ses pattes légèrement palmées en font un excellent nageur. Chasseur solitaire, il traque cerfs et sangliers à l'affût. Il est en danger critique d'extinction à cause de la déforestation et du braconnage.",[8,7,6]],"gorilledesmontagnes":["Grand singe","Le gorille des montagnes vit dans les forêts brumeuses des volcans des Virunga et du parc de Bwindi, en Afrique centrale. Il forme des groupes menés par un grand mâle à dos argenté, qui protège femelles et petits. Herbivore, il passe ses journées à manger feuilles, tiges et pousses. Longtemps au bord de l'extinction, il voit sa population remonter lentement grâce à une protection intensive.",[8,4,8]],"gorilledesplaines":["Grand singe","Le gorille des plaines habite les forêts tropicales humides d'Afrique centrale. Très fort mais d'un naturel calme, il vit en petits groupes familiaux guidés par un mâle à dos argenté. Pour impressionner un rival, il se dresse et se frappe la poitrine avec les mains ouvertes, un bruit audible de loin. Il se nourrit surtout de fruits et de feuilles, parfois de termites. Il est en danger critique d'extinction.",[8,4,8]],"pangolin":["Mammifère à écailles","Seul mammifère couvert d'écailles, le pangolin vit dans les forêts et savanes d'Afrique et d'Asie. La nuit, il éventre fourmilières et termitières avec ses griffes puissantes et attrape les insectes avec une très longue langue collante. Face au danger, il se roule en boule, protégé par ses écailles de kératine. Il est malheureusement l'un des mammifères les plus braconnés au monde.",[2,2,3]],"aigleroyal":["Oiseau de proie","Grand rapace des montagnes et des espaces ouverts de l'hémisphère Nord, l'aigle royal possède une vue perçante qui repère une proie de très loin. Il chasse marmottes, lièvres et jeunes ongulés, qu'il saisit avec des serres extrêmement puissantes. En piqué, il peut dépasser 200 km/h. Les couples, souvent fidèles, réutilisent et agrandissent le même nid pendant des années.",[6,9,6]],"girafe":["Ruminant de savane","Plus grand animal terrestre, la girafe peut dépasser 5 mètres de haut et broute les feuilles d'acacia hors de portée des autres herbivores. Sa langue, longue et préhensile, s'enroule autour des branches malgré les épines. Son cou ne compte que sept vertèbres, mais très allongées. Les mâles s'affrontent en balançant leur cou comme un fléau, et un coup de patte de girafe peut repousser un lion.",[7,6,4]],"loupgris":["Canidé sauvage","Ancêtre du chien, le loup gris vit en meutes familiales menées par un couple reproducteur. Il habite les forêts, montagnes et toundras de l'hémisphère Nord, et peut parcourir des dizaines de kilomètres par jour. Plus endurant que rapide, il chasse en équipe cerfs, élans ou sangliers en épuisant ses proies. Ses hurlements servent à rassembler la meute et à signaler son territoire.",[6,7,8]],"manchotempereur":["Oiseau marin","Plus grand des manchots, le manchot empereur vit en Antarctique et se reproduit en plein hiver, dans un froid extrême. Après la ponte, le mâle garde l'œuf sur ses pattes, sous un repli de peau, pendant environ deux mois sans manger. Les adultes se serrent en groupes compacts pour lutter contre le vent glacial. Excellent plongeur, il peut descendre à plus de 500 mètres pour chasser poissons et calmars.",[3,5,5]],"dauphin":["Mammifère marin","Le grand dauphin vit dans les eaux tempérées et tropicales du monde entier, en groupes aux liens changeants. Très intelligent, il repère ses proies par écholocation, en émettant des clics dont il écoute l'écho. Chaque dauphin possède un sifflement signature qui fonctionne comme un nom. Joueur et curieux, il coopère souvent avec ses congénères pour rabattre les bancs de poissons.",[5,8,9]],"martinetnoir":["Oiseau migrateur","Le martinet noir passe presque toute sa vie dans les airs : il y mange, y boit et y dort même. Il chasse les insectes en plein vol, bec grand ouvert, et ne se pose vraiment que pour nicher sous les toits ou dans les falaises. Après la reproduction en Europe, il migre vers l'Afrique, et certains restent en vol environ dix mois sans interruption. Ses pattes très courtes ne lui permettent presque pas de marcher.",[1,9,4]],"mouffette":["Mammifère nocturne","Reconnaissable à son pelage noir rayé de blanc, la mouffette rayée vit en Amérique du Nord, dans les bois, les prairies et même près des villes. Avant d'attaquer, elle prévient : elle tape des pattes, dresse sa queue et se cabre. Si l'ennemi insiste, elle projette avec précision un liquide à l'odeur insupportable, jusqu'à environ 3 mètres. Omnivore, elle mange insectes, œufs, fruits et petits rongeurs.",[3,3,4]],"porcepic":["Rongeur","Gros rongeur nocturne, le porc-épic est couvert de milliers de piquants, qui sont en fait des poils durcis. En danger, il les hérisse, les fait cliqueter et charge à reculons. Ses piquants se détachent facilement et restent plantés dans la peau de l'assaillant, mais contrairement à la légende, il ne peut pas les lancer. Herbivore, il ronge racines, écorces et fruits pendant la nuit.",[3,2,3]],"anguilleelectrique":["Poisson électrique","Malgré son nom, l'anguille électrique n'est pas une anguille mais un poisson-couteau d'Amérique du Sud. Elle vit dans les eaux troubles de l'Amazonie et de l'Orénoque et remonte régulièrement respirer de l'air à la surface. Des organes spéciaux, qui occupent la plus grande partie de son corps, produisent des décharges pouvant dépasser 600 volts, assez pour assommer une proie ou repousser un prédateur.",[6,3,3]],"zebre":["Équidé sauvage","Le zèbre des plaines vit en troupeaux dans les savanes d'Afrique de l'Est et du Sud, souvent aux côtés des gnous. Chaque zèbre a des rayures uniques, comme une empreinte digitale. Ces rayures semblent perturber les mouches piqueuses, qui se posent moins souvent sur lui. Face aux lions et aux hyènes, il fuit en groupe, mais il sait aussi mordre et donner des ruades très violentes.",[5,8,4]],"castor":["Rongeur bâtisseur","Le castor est un grand rongeur semi-aquatique d'Europe et d'Amérique du Nord. Avec ses incisives orange renforcées en fer, il abat des arbres pour construire huttes et barrages de branches, de boue et de pierres. Ces barrages créent des étangs qui accueillent de nombreuses autres espèces. Sa large queue plate lui sert de gouvernail et, frappée sur l'eau, donne l'alerte à toute la famille.",[3,3,6]],"cerfelaphe":["Cervidé","Grand cervidé des forêts d'Europe, le cerf élaphe vit en hardes séparées : les biches avec les jeunes d'un côté, les mâles entre eux de l'autre. Chaque année, le cerf perd ses bois à la fin de l'hiver puis en refait de nouveaux, souvent plus grands avec l'âge. À l'automne, pendant le brame, les mâles poussent des cris puissants et s'affrontent bois contre bois pour conquérir les biches.",[6,7,4]],"pigeonbiset":["Oiseau voyageur","Ancêtre des pigeons des villes, le pigeon biset nichait à l'origine sur les falaises d'Europe, d'Afrique du Nord et d'Asie. Il possède un sens de l'orientation remarquable, guidé par le soleil, le champ magnétique terrestre et sans doute les odeurs. Domestiqué depuis des millénaires, il a servi de messager, notamment pendant les guerres mondiales, pour porter des messages sur des centaines de kilomètres.",[1,7,6]],"libellule":["Insecte chasseur","La libellule est un insecte chasseur dont les ancêtres volaient déjà avant les dinosaures. Ses quatre ailes, qui battent indépendamment, lui permettent de faire du surplace, de voler à reculons ou de virer brusquement. Grâce à ses yeux immenses, elle anticipe la trajectoire de ses proies et capture la grande majorité des insectes qu'elle poursuit. Sa larve vit sous l'eau des mois, voire des années.",[2,8,3]],"carpe":["Poisson d'eau douce","Originaire d'Asie et d'Europe de l'Est, la carpe commune a été introduite dans les rivières et étangs du monde entier. Elle fouille la vase avec sa bouche extensible et ses barbillons pour trouver larves, vers et graines. Très résistante, elle supporte des eaux chaudes et pauvres en oxygène. Elle peut vivre plusieurs décennies et dépasser 30 kilos, ce qui en fait un poisson très recherché des pêcheurs.",[3,3,3]],"crapaudcommun":["Amphibien","Le crapaud commun vit dans les jardins, les bois et les prairies d'Europe, où il chasse la nuit insectes, limaces et vers. Sa peau verruqueuse sécrète une substance toxique qui décourage de nombreux prédateurs. Chaque printemps, il migre parfois sur plusieurs kilomètres pour retourner pondre dans la mare où il est né. La femelle y dépose de longs cordons contenant des milliers d'œufs.",[2,2,3]],"labradorretriever":["Chien de rapport","Le labrador retriever descend des chiens de Saint-Jean, qui aidaient les pêcheurs de Terre-Neuve à ramener filets et poissons. Développé en Angleterre au XIXe siècle comme chien de rapport pour la chasse au gibier d'eau, il adore nager. Doux, joueur et très facile à éduquer, il est aujourd'hui l'un des chiens de famille les plus populaires et un excellent chien guide d'aveugle.",[4,6,8]],"beagle":["Chien courant","Petit chien courant d'origine anglaise, le beagle chassait en meute le lièvre et le lapin. Son flair exceptionnel en fait aujourd'hui un chien détecteur dans les aéroports, où il repère fruits, viandes ou plantes interdits dans les bagages. Joyeux, sociable et curieux, il aime la compagnie mais peut se montrer têtu quand une odeur l'attire. Il donne volontiers de la voix en aboyant longuement.",[2,6,6]],"corgi":["Chien de berger","Originaire du pays de Galles, le corgi est un petit chien de troupeau aux pattes courtes et au corps allongé. Il guidait les vaches en leur pinçant les talons, sa petite taille lui permettant d'esquiver les coups de sabots. Vif, intelligent et affectueux, il reste un chien énergique qui a besoin d'activité. Le corgi Pembroke est célèbre pour avoir été le chien préféré de la reine Élisabeth II.",[2,5,8]],"levriergreyhound":["Lévrier","Le greyhound est un lévrier ancien, longtemps utilisé en Grande-Bretagne pour chasser le lièvre à vue. Avec son corps fin, sa poitrine profonde et ses longues pattes, il est le chien le plus rapide du monde et peut atteindre environ 70 km/h. Pourtant, à la maison, c'est un compagnon calme, doux et plutôt paresseux, qui aime dormir longtemps. Beaucoup d'anciens chiens de course sont adoptés en famille.",[4,9,5]],"dogueallemand":["Molosse","Le dogue allemand est l'une des plus grandes races de chiens au monde, certains mâles dépassant 80 centimètres au garrot. Développé en Allemagne pour chasser le sanglier puis garder les domaines, il impressionne par sa taille et son allure élégante, qui lui valent le surnom d'Apollon des chiens. Malgré ce physique de géant, c'est un chien doux, calme et affectueux avec sa famille.",[6,5,6]],"akitainu":["Chien japonais","Originaire des montagnes du nord du Japon, l'akita inu servait autrefois à chasser l'ours, le sanglier et le cerf. Puissant et digne, il est réservé avec les inconnus mais extrêmement loyal envers sa famille. Le célèbre Hachikō, un akita, attendit chaque jour son maître à la gare de Shibuya pendant près de dix ans après sa mort. Une statue lui rend hommage devant cette gare de Tokyo.",[5,5,6]],"lundehundnorvegien":["Chien de chasse","Le lundehund norvégien vient des îles Lofoten, où il chassait les macareux dans les falaises et les terriers. Il possède au moins six doigts par patte, peut refermer ses oreilles et renverser la tête en arrière jusqu'à toucher son dos. Cette souplesse l'aidait à se faufiler dans des galeries étroites. Presque disparue au XXe siècle, la race a été sauvée par quelques éleveurs. Il est vif et indépendant.",[1,5,6]],"persan":["Chat de race","Originaire de l'ancienne Perse, l'actuel Iran, le persan est arrivé en Europe au XVIIe siècle et a été perfectionné par les éleveurs anglais. C'est l'une des plus anciennes races de chats à poil long. Reconnaissable à sa face plate, ses grands yeux ronds et sa fourrure épaisse, il demande un brossage quotidien. Calme, doux et peu sportif, il préfère la tranquillité d'un intérieur aux grandes aventures.",[1,3,5]],"chatdesforetsnorvegiennes":["Chat de race","Le chat des forêts norvégiennes descend des chats de ferme scandinaves, habitués aux hivers rudes. Son épaisse fourrure imperméable, sa collerette et ses touffes de poils entre les doigts le protègent du froid. Excellent grimpeur, il peut descendre des arbres la tête la première grâce à ses griffes très solides. Robuste et sociable, il apprécie la compagnie tout en restant indépendant.",[2,5,6]],"abyssin":["Chat de race","L'abyssin doit son nom à l'Abyssinie, l'ancienne Éthiopie, d'où viendrait l'une des premières chattes de ce type présentées en Angleterre au XIXe siècle, mais ses vraies origines restent incertaines. Sa robe tiquetée, où chaque poil porte plusieurs bandes de couleur, lui donne l'allure d'un petit puma. Très actif, curieux et joueur, il adore grimper, explorer et supporte mal l'ennui.",[1,6,7]],"singapura":["Chat de race","Originaire de Singapour, le singapura a été développé dans les années 1970 à partir de chats des rues emmenés aux États-Unis. C'est l'une des plus petites races de chats du monde, avec un corps fin, de grands yeux et de grandes oreilles. Sa robe tiquetée couleur sépia lui donne un air sauvage. Curieux, joueur et très attaché à ses humains, il aime tout observer depuis un endroit en hauteur.",[1,5,6]],"lynxboreal":["Félin sauvage","Plus grand félin sauvage d'Europe, le lynx boréal vit dans les forêts de montagne et la taïga, des Vosges jusqu'à la Sibérie. Ses larges pattes très poilues agissent comme des raquettes et l'empêchent de s'enfoncer dans la neige. Solitaire et discret, il chasse surtout à l'affût chevreuils, chamois et lièvres. Ses oreilles terminées par des pinceaux de poils noirs et ses favoris lui donnent un air unique.",[5,7,5]],"rhytinedesteller":["Mammifère marin disparu","Découverte en 1741 par l'expédition de Vitus Béring, la rhytine de Steller était une immense vache de mer qui vivait près des îles du Commandeur, dans le Pacifique Nord. Lente et paisible, elle broutait le varech dans les eaux froides et pouvait mesurer près de 8 mètres. Chassée intensivement pour sa viande et sa graisse, elle a disparu vers 1768, à peine 27 ans après sa découverte.",[7,1,3]],"tigredejava":["Grand félin disparu","Le tigre de Java vivait dans les forêts de l'île de Java, en Indonésie. Plus petit que les tigres du continent, il portait des rayures nombreuses et fines. La croissance de la population humaine, la destruction des forêts au profit des cultures et la chasse ont fait chuter ses effectifs. Les dernières observations sûres datent des années 1970, et il est aujourd'hui considéré comme éteint.",[8,7,6]],"spinosaure":["Dinosaure carnivore","Le spinosaure vivait il y a environ 95 millions d'années, au Crétacé, dans les grands réseaux de rivières d'Afrique du Nord. L'un des plus grands dinosaures carnivores connus, il portait sur le dos une haute voile soutenue par des épines osseuses. Son museau allongé, proche de celui d'un crocodile, et ses dents coniques étaient adaptés aux gros poissons. Les scientifiques débattent encore de ses talents de nageur.",[9,5,4]],"smilodon":["Félin préhistorique","Le smilodon vivait sur le continent américain pendant le Pléistocène et s'est éteint il y a environ 10 000 ans, à la fin de la dernière ère glaciaire. Surnommé tigre à dents de sabre, il n'était pas un tigre mais appartenait à une branche de félins aujourd'hui disparue. Massif et musclé, il immobilisait de grandes proies comme les bisons avant de les tuer avec ses canines de plus de 20 centimètres.",[9,5,5]],"brachiosaure":["Dinosaure herbivore","Le brachiosaure vivait il y a environ 150 millions d'années, au Jurassique supérieur, en Amérique du Nord. Ce géant à long cou avait des pattes avant plus longues que les pattes arrière, ce qui lui donnait une silhouette de girafe. Il pouvait brouter la cime des arbres à plus de 12 mètres de haut. Pour nourrir son énorme corps, il devait avaler chaque jour d'immenses quantités de végétaux.",[10,2,2]],"ankylosaure":["Dinosaure cuirassé","L'ankylosaure vivait à la toute fin du Crétacé, il y a environ 68 à 66 millions d'années, en Amérique du Nord, à l'époque du tyrannosaure. Ce gros herbivore bas sur pattes était protégé par une armure de plaques osseuses incrustées dans sa peau, jusque sur les paupières. Sa queue se terminait par une lourde massue en os, capable de briser les os d'un prédateur. Il a disparu avec les autres dinosaures non aviens.",[8,2,3]],"trilobite":["Arthropode fossile","Les trilobites étaient des arthropodes marins apparus il y a plus de 520 millions d'années, au Cambrien. Pendant près de 300 millions d'années, ils ont peuplé les fonds de tous les océans, avec des milliers d'espèces. Protégés par une carapace articulée, certains pouvaient se rouler en boule. Leurs yeux en cristaux de calcite sont parmi les plus anciens connus. Ils ont disparu lors de la grande extinction de la fin du Permien.",[1,1,1]],"hippocampe":["Poisson marin","L'hippocampe est un petit poisson des herbiers et des récifs côtiers, qui nage à la verticale en faisant onduler sa nageoire dorsale. Mauvais nageur, il s'accroche aux algues avec sa queue préhensile et aspire de minuscules crustacés grâce à son museau en forme de tube. Fait unique : c'est le mâle qui porte les œufs dans une poche ventrale, puis met au monde des dizaines, voire des centaines de petits.",[1,1,3]],"wombat":["Marsupial","Le wombat est un marsupial trapu d'Australie qui creuse de longs terriers avec ses griffes puissantes. Sa poche s'ouvre vers l'arrière, ce qui évite qu'elle se remplisse de terre quand il creuse. Il est célèbre pour ses crottes en forme de petits cubes, qu'il dépose bien en vue pour marquer son territoire. Lent en apparence, il peut pourtant courir étonnamment vite sur de courtes distances.",[3,4,4]],"pandaroux":["Mammifère arboricole","Le panda roux vit dans les forêts de montagne de l'Himalaya et du sud-ouest de la Chine. Malgré son nom, il n'est pas un proche parent du panda géant : il forme à lui seul une famille à part. Il se nourrit surtout de bambou, qu'il saisit grâce à un faux pouce, un os du poignet allongé. Agile grimpeur, il passe beaucoup de temps dans les arbres et s'enroule dans sa queue touffue pour dormir.",[2,4,5]],"morphobleu":["Papillon tropical","Le morpho bleu vit dans les forêts tropicales d'Amérique centrale et du Sud. Le dessus de ses ailes brille d'un bleu métallique éclatant, qui ne vient pas d'un pigment mais de la forme microscopique de ses écailles, qui renvoient la lumière. Le dessous, brun avec des ocelles, le camoufle lorsqu'il se pose ailes fermées. Il se nourrit surtout du jus des fruits tombés au sol.",[1,4,2]],"iguanemarin":["Lézard marin","Endémique des îles Galápagos, l'iguane marin est le seul lézard au monde qui se nourrit dans la mer. Il plonge pour brouter les algues sur les rochers, puis se réchauffe longuement au soleil sur la lave noire. Des glandes près des narines lui permettent d'éliminer l'excès de sel, qu'il rejette en éternuant. Lors des années de disette, sa taille peut même diminuer pour survivre.",[2,2,3]],"tarsier":["Primate nocturne","Le tarsier est un minuscule primate des forêts d'Asie du Sud-Est, notamment des Philippines et d'Indonésie. Chacun de ses yeux, immenses et fixes, est plus gros que son cerveau ; pour regarder autour de lui, il tourne la tête presque à 180 degrés. Chasseur nocturne, il bondit de branche en branche grâce à ses longues pattes arrière et attrape insectes et petits lézards.",[1,5,4]],"oursesprit":["Ours","L'ours esprit, ou ours Kermode, est un ours noir au pelage blanc qui vit dans la forêt pluviale côtière de Colombie-Britannique, au Canada. Sa couleur vient d'un gène récessif rare : il n'est ni albinos ni ours polaire. Selon certaines études, sa robe claire le rendrait moins visible des saumons, qu'il pêche dans les rivières en automne. Les peuples autochtones de la région le considèrent comme sacré.",[8,6,6]],"leopardneiges":["Grand félin","Fantôme des hautes montagnes d'Asie centrale, le léopard des neiges vit seul entre rochers et pentes glacées, souvent au-dessus de 3 000 mètres. Son épaisse fourrure grise tachetée le camoufle parfaitement, et sa longue queue touffue l'aide à garder l'équilibre et lui sert d'écharpe. Bondissant avec une agilité stupéfiante, il chasse bouquetins et mouflons sur des falaises abruptes.",[7,7,6]],"faucon":["Oiseau de proie","Présent sur presque tous les continents, le faucon pèlerin niche aussi bien sur les falaises que sur les gratte-ciel des grandes villes. Il repère ses proies de très haut, puis plonge ailes repliées en un piqué vertigineux qui en fait l'animal le plus rapide du monde. Il frappe en plein vol pigeons, étourneaux et canards. Menacé par les pesticides au XXe siècle, il a fait un beau retour.",[3,10,6]],"mante":["Crustacé marin","Habitante colorée des récifs coralliens tropicaux, la mante-crevette vit dans un terrier creusé dans le sable ou la roche. Ses pattes ravisseuses se détendent comme un ressort et frappent avec une violence inouïe, brisant les coquilles de crabes et d'escargots. Ses yeux sont parmi les plus complexes du règne animal : ils perçoivent l'ultraviolet et la lumière polarisée.",[4,6,4]],"paresseux":["Mammifère arboricole","Habitant des forêts tropicales d'Amérique centrale et du Sud, le paresseux passe presque toute sa vie suspendu aux branches par ses longues griffes recourbées. Il se nourrit de feuilles peu nourrissantes et économise son énergie en bougeant très lentement. Des algues poussent dans sa fourrure et lui donnent une teinte verdâtre qui le camoufle. Il descend surtout pour faire ses besoins.",[2,1,3]],"grenouille":["Amphibien","Bien connue des mares et des étangs d'Europe, la grenouille verte passe ses journées au bord de l'eau, prête à plonger au moindre danger. Elle capture insectes, vers et araignées d'un coup de langue collante. Au printemps, les mâles gonflent deux sacs vocaux de chaque côté de la tête et coassent en chœur. Ses longues pattes arrière en font une excellente sauteuse et nageuse.",[1,5,3]],"okapi":["Mammifère forestier","Discret habitant des forêts denses de la République démocratique du Congo, l'okapi n'a été décrit par les scientifiques qu'au début du XXe siècle. Avec ses pattes rayées comme celles d'un zèbre, il est pourtant le seul proche parent vivant de la girafe. Solitaire, il broute feuilles et bourgeons grâce à une langue préhensile si longue qu'il s'en sert pour se nettoyer.",[5,6,5]],"leoparddelamour":["Grand félin","Vivant dans les forêts tempérées de l'extrême-orient russe et du nord-est de la Chine, le léopard de l'Amour est l'un des félins les plus menacés au monde. Sa fourrure longue et pâle, aux grandes rosettes, le protège des hivers glacials. Solitaire et nocturne, il chasse chevreuils et sangliers. Grâce à un parc national créé pour lui, sa population remonte lentement.",[7,8,6]],"ourspolaire":["Grand prédateur arctique","Seigneur de la banquise arctique, l'ours polaire est le plus grand carnivore terrestre. Il chasse surtout les phoques, qu'il guette patiemment près des trous de respiration dans la glace. Excellent nageur, il peut parcourir de longues distances dans l'eau glacée. Sa couche de graisse et sa fourrure le protègent du froid, mais la fonte de la banquise menace son territoire de chasse.",[10,5,7]],"tigredubengale":["Grand félin","Roi des forêts et des mangroves de l'Inde et du Bangladesh, le tigre du Bengale est un chasseur solitaire d'une puissance redoutable. Il s'approche de ses proies en silence, cerfs ou buffles, puis les surprend d'un bond fulgurant. Contrairement à beaucoup de félins, il aime l'eau et nage très bien. Animal national de l'Inde, il est protégé dans de nombreuses réserves.",[9,7,7]],"crocodilemarin":["Grand reptile","Présent de l'Inde à l'Australie, le crocodile marin vit dans les estuaires, les mangroves et les côtes, et peut même traverser des bras de mer. Ce prédateur patient attend, immobile, que buffles, sangliers ou poissons s'approchent, puis jaillit de l'eau. Sa morsure est l'une des plus puissantes du monde animal. Il peut rester des mois sans manger après un gros repas.",[10,5,4]],"elephantdafrique":["Mammifère géant","Géant des savanes et des forêts africaines, l'éléphant d'Afrique vit en troupeaux familiaux menés par une femelle âgée et expérimentée, la matriarche. Sa trompe, qui compte des dizaines de milliers de muscles, lui sert à boire, saisir, sentir et communiquer. Doté d'une excellente mémoire, il retrouve les points d'eau sur de longues distances et semble pleurer ses morts.",[10,4,9]],"mambanoir":["Serpent venimeux","Habitant des savanes et des zones rocheuses d'Afrique australe et orientale, le mamba noir doit son nom à l'intérieur de sa bouche, d'un noir d'encre, qu'il ouvre quand il se sent menacé. Sa peau est en réalité grise ou olive. Très rapide, il fuit en général l'humain, mais acculé il peut mordre plusieurs fois. Son venin neurotoxique est extrêmement puissant.",[7,8,4]],"morse":["Mammifère marin","Massif habitant des eaux arctiques, le morse se reconnaît à ses longues défenses et à sa moustache épaisse. Il vit en grands groupes bruyants sur la glace ou les plages. Ses vibrisses très sensibles l'aident à repérer coquillages et vers sur le fond marin, qu'il aspire avec une force étonnante. Ses défenses lui servent aussi à impressionner ses rivaux et à défendre sa place.",[8,3,6]],"koala":["Marsupial","Emblème de l'Australie orientale, le koala passe sa vie perché dans les eucalyptus, dont il mange presque exclusivement les feuilles. Ce régime pauvre et toxique pour la plupart des animaux lui fournit peu d'énergie, ce qui explique ses très longues siestes. Comme le kangourou, la femelle porte son petit dans une poche, avant de le transporter sur son dos.",[2,2,3]],"colibri":["Petit oiseau nectarivore","Joyau volant des Amériques, le colibri bat des ailes si vite qu'elles produisent un bourdonnement. Il peut rester immobile en vol stationnaire devant une fleur pour en aspirer le nectar avec sa longue langue. Son cœur bat à un rythme effréné et il doit manger presque sans arrêt. La nuit, il entre dans une sorte de torpeur pour économiser son énergie jusqu'au matin.",[1,8,5]],"hyenetachetee":["Carnivore de savane","Habitante des savanes africaines, la hyène tachetée vit en clans dirigés par les femelles, plus grandes et dominantes que les mâles. Contrairement à sa réputation de simple charognard, elle chasse elle-même la majorité de ses proies, comme les gnous et les zèbres, en groupe et avec endurance. Ses cris ressemblant à des rires lui servent à communiquer avec les autres membres du clan.",[7,7,7]],"poissonglobe":["Poisson venimeux","Habitant des mers chaudes, le poisson-globe nage lentement mais possède une défense redoutable : face à un danger, il avale de l'eau et se transforme en boule hérissée, difficile à avaler. Sa peau et certains organes contiennent la tétrodotoxine, un poison bien plus puissant que le cyanure. Au Japon, seuls des cuisiniers spécialement formés ont le droit de le préparer, le fugu.",[3,2,3]],"veuvenoire":["Araignée venimeuse","Présente en Amérique du Nord, la veuve noire tisse une toile irrégulière dans les coins sombres, sous les pierres ou dans les cabanes. La femelle, noire et brillante, est bien plus grande que le mâle, qu'elle dévore parfois après l'accouplement, d'où son nom. Son venin agit sur les nerfs, mais elle est timide et ne mord que si elle se sent écrasée ou dérangée.",[3,2,2]],"rhinocerosblanc":["Grand herbivore","Deuxième plus grand mammifère terrestre après l'éléphant, le rhinocéros blanc broute l'herbe des savanes d'Afrique grâce à sa large lèvre carrée. Son nom viendrait d'une confusion avec un mot signifiant « large », et non de sa couleur grise. Malgré sa masse, il peut charger à grande vitesse. Sauvé de justesse de l'extinction, il reste menacé par le braconnage pour sa corne.",[10,5,5]],"blaireau":["Mammifère fouisseur","Habitant des bois et des bocages d'Europe, le blaireau est un infatigable terrassier qui creuse avec ses puissantes griffes de vastes terriers à plusieurs entrées, appelés blaireautières. Nocturne et discret, il vit en petits groupes familiaux. Omnivore, il se régale de vers de terre, de fruits, de racines et de petits animaux. Très propre, il change régulièrement la litière de son terrier.",[4,3,5]],"moineaudomestique":["Petit passereau","Compagnon des humains depuis des milliers d'années, le moineau domestique a suivi l'agriculture et les villes jusqu'à s'installer sur presque tous les continents. Il niche dans les trous des murs, sous les toits ou dans les haies. Granivore, il mange aussi des insectes, surtout pour nourrir ses petits. Bavard et sociable, il vit en bandes animées qui pépient sans cesse.",[1,5,5]],"bourdon":["Insecte pollinisateur","Cousin velu de l'abeille, le bourdon vit en petites colonies menées par une reine, souvent installées dans le sol ou un vieux nid de rongeur. Grâce à son épaisse fourrure et à sa capacité à produire de la chaleur, il butine même par temps frais, quand d'autres insectes restent immobiles. Il pratique la pollinisation par vibration, très utile pour les tomates.",[1,4,4]],"papillonmonarque":["Papillon migrateur","Reconnaissable à ses ailes orange veinées de noir, le monarque vit en Amérique du Nord. Chaque automne, des millions d'entre eux migrent vers le sud et se rassemblent en grappes serrées sur les sapins des montagnes du Mexique pour passer l'hiver. Ses chenilles se nourrissent d'asclépiade, une plante toxique : le poison qu'elles stockent rend le papillon immangeable.",[1,4,3]],"escargotdebourgogne":["Mollusque terrestre","Le plus grand escargot terrestre d'Europe, l'escargot de Bourgogne vit dans les jardins, les bois clairs et les prairies. Il avance lentement sur un tapis de mucus et sort surtout par temps humide pour brouter les plantes. Quand il fait trop sec ou trop froid, il se retire dans sa coquille, qu'il ferme d'un opercule calcaire. Il est protégé dans plusieurs pays.",[1,1,1]],"lezarddesmurailles":["Petit reptile","Très commun en Europe, le lézard des murailles adore les vieux murs, les rochers et les tas de pierres où il se chauffe au soleil. Agile et vif, il grimpe sur les surfaces verticales et chasse insectes et araignées. Quand un prédateur l'attrape, il peut abandonner sa queue, qui continue de gigoter pour faire diversion. Elle repousse ensuite, mais en plus court.",[1,6,3]],"medusecommune":["Animal marin gélatineux","Présente dans de nombreux océans, la méduse commune, ou aurélie, se reconnaît aux quatre anneaux visibles à travers son corps transparent. Faite à plus de 95 % d'eau, elle dérive au gré des courants en contractant doucement son ombrelle. Ses courts tentacules urticants capturent plancton et petites larves. Sa piqûre est faible et généralement sans danger pour l'humain.",[1,1,1]],"bouledoguefrancais":["Chien de compagnie","Né au XIXe siècle de petits bouledogues anglais amenés en France par des dentelliers de Nottingham, le bouledogue français est devenu le chouchou des Parisiens. Compact et musclé, il a un museau écrasé et de grandes oreilles dressées. Joueur, affectueux et un brin têtu, il aime la compagnie. Son nez court le rend sensible à la chaleur et aux efforts.",[2,3,5]],"bordercollie":["Chien de berger","Originaire de la frontière entre l'Angleterre et l'Écosse, le border collie a été sélectionné pour rassembler les moutons. Il travaille avec un regard fixe et intense, le fameux « œil », qui guide le troupeau sans le brusquer. Extrêmement vif et attentif, il apprend très vite de nombreux ordres. Il a besoin de beaucoup d'exercice et de défis pour être heureux.",[3,8,10]],"schipperke":["Chien de garde","Petit chien noir originaire de Belgique, le schipperke tient son nom d'un mot flamand signifiant « petit batelier ». Il gardait jadis les péniches des canaux et les ateliers d'artisans, aboyant contre les intrus et chassant rats et souris. Curieux, vif et infatigable, il est très attaché à sa famille et méfiant envers les inconnus. Son allure rappelle celle d'un petit renard.",[2,6,7]],"saintbernard":["Chien de montagne","Le saint-bernard doit son nom à l'hospice du col du Grand-Saint-Bernard, dans les Alpes suisses, où des moines l'élevaient. Il les aidait à retrouver les voyageurs perdus dans la neige ou le brouillard ; le plus célèbre, Barry, aurait sauvé des dizaines de vies. Colosse calme et patient, il est doux avec les enfants. Le petit tonneau à son cou relève surtout de la légende.",[6,3,6]],"sphynx":["Chat de race","Apparu au Canada dans les années 1960 grâce à une mutation naturelle, le sphynx est célèbre pour son absence apparente de poils. Sa peau ridée, douce comme du daim, laisse voir les taches de couleur qu'aurait eues son pelage. Très affectueux, curieux et démonstratif, il recherche la chaleur et la compagnie. Il a besoin de bains réguliers, car sa peau devient vite grasse.",[1,5,6]],"chienlouptchecoslovaque":["Chien de travail","Créé dans les années 1950 en Tchécoslovaquie, le chien-loup tchécoslovaque devait allier l'endurance du loup des Carpates au caractère du berger allemand pour patrouiller aux frontières. Il en a gardé l'allure sauvage, les yeux ambrés et une grande résistance. Loyal, vif et très actif, il demande un maître expérimenté. Il préfère souvent hurler plutôt qu'aboyer.",[6,8,7]],"chatdegouttieretigre":["Chat domestique","Le plus répandu de tous les chats, le chat de gouttière tigré n'appartient à aucune race officielle. Son pelage rayé, hérité de son ancêtre sauvage, le chat ganté d'Afrique, l'aide à se camoufler. Indépendant, débrouillard et excellent chasseur, il s'adapte aussi bien à la ville qu'à la campagne. Robuste, il vit souvent longtemps et forme des liens forts avec ses humains.",[2,6,6]],"sacredebirmanie":["Chat de race","Entouré de légendes sur des temples birmans, le sacré de Birmanie a en réalité été développé en France dans les années 1920. Ses yeux bleu saphir, son pelage mi-long soyeux aux extrémités foncées et ses pattes gantées de blanc le rendent unique. Calme, doux et sociable, il aime suivre ses maîtres partout dans la maison sans être envahissant. Il s'entend bien avec les enfants.",[1,4,6]],"turcdevan":["Chat de race","Originaire de la région du lac de Van, dans l'est de la Turquie, le turc de Van est un chat ancien au pelage blanc, avec des taches colorées sur la tête et la queue. Sa fourrure soyeuse, presque imperméable, lui permet de se baigner sans trop se mouiller. Énergique, joueur et grand sauteur, il adore grimper en hauteur. Il est très attaché à ses humains mais déteste l'ennui.",[2,6,6]],"thylacine":["Marsupial disparu","Aussi appelé tigre de Tasmanie à cause des rayures de son dos, le thylacine était le plus grand marsupial carnivore des temps modernes. Disparu d'Australie continentale il y a des milliers d'années, il a survécu en Tasmanie jusqu'au XXe siècle. Accusé de tuer les moutons, il a été chassé avec des primes. Le dernier connu est mort au zoo de Hobart en 1936.",[5,6,5]],"caracal":["Félin sauvage","Habitant des savanes sèches, des déserts et des collines d'Afrique, du Moyen-Orient et d'Asie centrale, le caracal se reconnaît à ses longues touffes de poils noirs au bout des oreilles. Solitaire et discret, il chasse surtout la nuit rongeurs, damans et antilopes. Ses puissantes pattes arrière lui permettent de bondir à la verticale pour attraper des oiseaux au décollage.",[4,8,6]],"pigeonmigrateuramericain":["Oiseau disparu","Le pigeon migrateur américain fut sans doute l'oiseau le plus abondant d'Amérique du Nord : ses vols obscurcissaient le ciel pendant des heures. Il nichait en colonies géantes dans les forêts de l'Est. Au XIXe siècle, une chasse massive et la destruction des forêts l'ont décimé en quelques décennies. Le dernier, une femelle nommée Martha, est morte au zoo de Cincinnati en 1914.",[1,8,5]],"baiji":["Dauphin d'eau douce","Le baiji, ou dauphin du Yangtsé, vivait dans les eaux troubles du plus long fleuve de Chine. Presque aveugle, il se repérait grâce à l'écholocalisation. Pollution, barrages, trafic fluvial et filets de pêche l'ont fait décliner rapidement. En 2006, une grande expédition n'en a trouvé aucun : il est considéré comme probablement éteint, premier cétacé disparu à cause de l'humain.",[4,6,7]],"paresseuxgeantmegatherium":["Mammifère préhistorique","Le mégathérium était un paresseux géant qui vivait en Amérique du Sud jusqu'à la fin de la dernière ère glaciaire, il y a environ 10 000 ans. Aussi lourd qu'un éléphant, il vivait au sol et pouvait se dresser sur ses pattes arrière, appuyé sur sa queue, pour arracher les feuilles des arbres avec ses énormes griffes. Sa disparition coïncide avec l'arrivée des humains.",[9,2,3]],"tyrannosaure":["Dinosaure carnivore","Le tyrannosaure vivait en Amérique du Nord à la toute fin du Crétacé, il y a environ 68 à 66 millions d'années. Long de plus de 12 mètres, il possédait un crâne massif armé de dents en forme de banane capables de broyer les os. Ses petits bras contrastaient avec ses pattes puissantes. Il a disparu avec les autres dinosaures non aviens lors de la chute d'un astéroïde.",[10,6,4]],"velociraptor":["Dinosaure carnivore","Le vélociraptor vivait il y a environ 75 millions d'années dans les régions désertiques de l'actuelle Mongolie. Bien plus petit que dans les films, il était couvert de plumes et ressemblait à un oiseau coureur. Sur chaque pied, il portait une grande griffe recourbée pour immobiliser ses proies. Un célèbre fossile le montre figé en plein combat avec un protocératops.",[3,8,5]],"mosasaure":["Reptile marin préhistorique","Le mosasaure régnait sur les mers chaudes de la fin du Crétacé, il y a entre 82 et 66 millions d'années. Ce n'était pas un dinosaure, mais un lézard marin géant apparenté aux varans. Avec ses mâchoires puissantes, il chassait poissons, tortues et ammonites. Son premier fossile, trouvé près de Maastricht, aux Pays-Bas, lui a donné son nom. Il a disparu avec les dinosaures.",[10,7,4]],"archeopteryx":["Dinosaure à plumes","L'archéoptéryx vivait il y a environ 150 millions d'années, au Jurassique supérieur, sur des îles de l'actuelle Allemagne. Grand comme un corbeau, il avait des ailes à plumes comme un oiseau, mais aussi des dents, des griffes aux doigts et une longue queue osseuse comme un dinosaure. Découvert en 1861, il est devenu un symbole du lien entre dinosaures et oiseaux.",[1,5,3]],"lemurcatta":["Primate de Madagascar","Uniquement présent dans le sud de Madagascar, le lémur catta se reconnaît à sa longue queue annelée de noir et de blanc. Il vit en groupes dirigés par les femelles et passe plus de temps au sol que les autres lémuriens. Le matin, il se chauffe au soleil, bras écartés. Lors de conflits, les mâles imprègnent leur queue de l'odeur de leurs glandes et l'agitent vers leurs rivaux.",[2,6,6]],"loupacriniere":["Canidé sauvage","Habitant des prairies et savanes d'Amérique du Sud, le loup à crinière est le plus grand canidé du continent. Ses pattes très longues lui permettent de voir par-dessus les hautes herbes. Solitaire et timide, il chasse rongeurs et oiseaux, mais mange aussi beaucoup de fruits, notamment la « lobeira », le fruit du loup. Son urine a une odeur forte qui rappelle le cannabis.",[4,7,5]],"arahyacinthe":["Perroquet","Habitant du centre de l'Amérique du Sud, notamment du Pantanal brésilien, l'ara hyacinthe arbore un plumage bleu cobalt et un cercle jaune autour des yeux. Son bec énorme est assez puissant pour ouvrir les noix de palmier les plus dures. Il vit en couple fidèle et niche dans les cavités des grands arbres. Longtemps capturé pour le commerce, il est aujourd'hui protégé.",[3,6,8]],"mantereligieuse":["Insecte prédateur","La mante religieuse doit son nom à ses pattes avant repliées, comme en prière. Immobile et camouflée dans les herbes, elle attend qu'un insecte passe à portée, puis le saisit en un éclair avec ses pattes garnies d'épines. Sa tête triangulaire très mobile lui offre une vue précise pour viser. Il arrive que la femelle dévore le mâle pendant ou après l'accouplement.",[2,4,3]],"casoar":["Oiseau coureur","Habitant des forêts tropicales de Nouvelle-Guinée et du nord-est de l'Australie, le casoar est un grand oiseau incapable de voler. Il porte sur la tête un casque osseux et possède un cou bleu vif orné de caroncules rouges. Il mange surtout des fruits tombés et disperse leurs graines dans la forêt. Menacé, il peut donner de redoutables coups de pattes armées d'une longue griffe.",[6,7,4]],"baudroieabyssale":["Poisson des abysses","La baudroie abyssale vit dans l'obscurité totale des profondeurs océaniques. Sur son front, un filament se termine par une petite lanterne où des bactéries produisent de la lumière, attirant les proies jusqu'à sa gueule garnie de dents pointues. Chez certaines espèces, le minuscule mâle se fixe à la femelle et fusionne avec elle pour toujours. Son estomac extensible avale de grosses proies.",[2,1,2]],"oursalunettes":["Ours","Seul ours d'Amérique du Sud, l'ours à lunettes vit dans les forêts humides et les hauts plateaux des Andes. Il doit son nom aux taches claires qui entourent souvent ses yeux et rendent chaque individu unique. Excellent grimpeur, il construit des plateformes dans les arbres pour manger et se reposer. Il se nourrit surtout de plantes, de broméliacées et de fruits, et inspira Paddington.",[7,4,6]]};

let AC,soundOn=true;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function buzz(v){try{navigator.vibrate&&navigator.vibrate(v)}catch(e){}}
function noise(delay,dur,f0,f1,vol){if(!AC||!soundOn)return;try{const t=AC.currentTime+delay,n=AC.sampleRate*dur|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let g=1;
  for(let k=0;k<n;k++){if(k%90===0)g=Math.random()**2;d[k]=(Math.random()*2-1)*g}
  const src=AC.createBufferSource();src.buffer=b;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=.8;bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur*.85);
  const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(vol,t+.03);gn.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(bp).connect(gn).connect(AC.destination);src.start(t)}catch(e){}}
function note(f,delay,dur,vol){if(!AC||!soundOn)return;try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}}

function lean(el,x,y){const t=el.querySelector('.tilt');el.classList.add('hand');t.style.setProperty('--ry',((x-.5)*30)+'deg');t.style.setProperty('--rx',((.5-y)*30)+'deg');el.style.setProperty('--mx',x*100+'%');el.style.setProperty('--my',y*100+'%')}

  const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx),Math.abs(e.clientY-sy));
  if(Math.abs(dx)>14){el.style.transition='none';el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`}
  else lean(el,Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)))});
function endDrag(e){if(sx===null)return;const dx=(e&&e.clientX!=null?e.clientX:sx)-sx;sx=null;const el=DK.children[cur];if(!el)return;el.style.transition='';el.style.transform='';
  if(Math.abs(dx)>70)toss(dx<0?-1:1);else if(moved<10)toss(1)}
DK.addEventListener('pointerup',endDrag);DK.addEventListener('pointercancel',()=>{sx=null;const el=DK.children[cur];if(el){el.style.transition='';el.style.transform=''}});
window.addEventListener('deviceorientation',e=>{if(e.gamma==null||ST.hidden||!ST.classList.contains('done'))return;const el=DK.children[cur];if(!el||sx!==null)return;
  lean(el,.5+Math.max(-30,Math.min(30,e.gamma))/80,.5+Math.max(-30,Math.min(30,e.beta-45))/80)});
function toss(dir){const el=DK.children[cur];if(!el)return;el.style.setProperty('--dir',dir);el.classList.remove('hand');$('hint').style.opacity=0;noise(0,.25,600,1800,.08);
  cur++;layout();if(cur>=SP.length)later(showRes,450);else later(reveal,350)}
function showRes(){timers.forEach(clearTimeout);timers=[];ST.classList.add('result');$('tint').style.backgroundColor='';
  const news=SP.filter(x=>x.isNew).length;
  $('sum').innerHTML=TEST?'Sachet test : rien n\'a été ajouté à votre album.':`${news} nouvelle${news>1?'s':''} sur ${SP.length}<br>${owned().length} animaux sur ${CARDS.length} dans votre album`;
  $('rgrid').innerHTML=SP.map((x,i)=>`<button style="--i:${i}" data-id="${x.c.id}">${card(x.c,true)}${TEST?'':`<span class="new${x.isNew?'':' dup'}">${x.isNew?'Nouvelle':'Doublon'}</span>`}</button>`).join('');
  $('rgrid').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>show(BY[b.dataset.id])));
  $('resMore').hidden=TEST||!stock.n;$('res').hidden=false}
$('skip').addEventListener('click',()=>{if(!ST.classList.contains('torn')&&!ST.classList.contains('done'))return;showRes()});
$('resOk').addEventListener('click',()=>{ST.hidden=true;render()});
$('resMore').addEventListener('click',()=>{ST.hidden=true;render();$('open')&&$('open').click()});
/* ---------------- mode démo : tester les cartes sans toucher à la collection ---------------- */
let TEST=false,pickD=[],dP='Tous',qD='',qA='';
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
/* recherche : on masque les cartes sans redessiner la page, pour garder le clavier ouvert */
function bindSearch(m,keep){const q=m.querySelector('#q'),g=m.querySelector('.grid');if(!q||!g)return;
  const run=()=>{const v=norm(q.value.trim());keep(q.value);let n=0;
    [...g.children].forEach(b=>{const ok=!v||(b.dataset.n||'').includes(v);b.hidden=!ok;if(ok)n++});
    let e=m.querySelector('.empty-q');if(!n&&!e){e=document.createElement('p');e.className='empty-q';g.after(e)}if(e){e.hidden=!!n;e.textContent='Aucun animal ne correspond.'}};
  q.addEventListener('input',run);if(q.value)run()}
function rDemo(){
  const m=$('main');
  m.innerHTML=`<h2>Mode démo</h2><p class="lead">Pour tester les cartes et l'ouverture des sachets. Rien ici ne compte : ni dans votre album, ni dans vos sachets, ni dans le classement.</p>
    <div class="row"><button class="btn" id="dOpen">${pickD.length?`Ouvrir avec ces ${pickD.length} carte${pickD.length>1?'s':''}`:'Ouvrir un sachet test'}</button>${pickD.length?'<button class="btn ghost" id="dClr">Vider le choix</button>':''}</div>
    <p class="lead" style="margin-top:12px">Touchez des cartes pour les choisir (5 au plus) : le sachet test contiendra celles-là. Sans choix, il est tiré au hasard. Appui long pour voir une carte en grand.</p>
    <div class="tools"><input class="search" id="q" type="search" placeholder="Rechercher un animal" autocomplete="off" value="${esc(qD)}"></div>
    <div class="packs">${['Tous',...Object.keys(PACK)].map(p=>`<button class="chip" data-p="${p}" style="--pc:${PACK[p]||'var(--gold)'}" aria-pressed="${p===dP}">${p}<small>${CARDS.filter(c=>p==='Tous'||c.p===p).length}</small></button>`).join('')}</div>
    <div class="grid">${CARDS.filter(c=>dP==='Tous'||c.p===dP).map(c=>{const k=pickD.indexOf(c.id);return `<button data-id="${c.id}" data-n="${esc(norm(c.n))}" aria-label="${esc(c.n)}" aria-pressed="${k>=0}"${k>=0?' style="outline:3px solid var(--gold);outline-offset:2px;border-radius:12px"':''}>${card(c,true)}${k>=0?`<span class="cnt">${k+1}</span>`:''}</button>`}).join('')}</div>`;
  $('dOpen').addEventListener('click',()=>{
    const got=pickD.length?pickD.map(id=>BY[id]):shuffle([0,1,2,3].map(()=>drawCard(1)).concat([drawCard(2)]));
    TEST=true;openStage(got.map(c=>({c,isNew:false})))});
  if($('dClr'))$('dClr').addEventListener('click',()=>{pickD=[];rDemo()});
  m.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{dP=b.dataset.p;rDemo()}));
  bindSearch(m,v=>qD=v);
  m.querySelectorAll('[data-id]').forEach(b=>{let lp=0,t=0;
    b.addEventListener('pointerdown',()=>{lp=0;t=setTimeout(()=>{lp=1;show(BY[b.dataset.id])},450)});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(t)));
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('click',()=>{if(lp)return;const id=b.dataset.id,k=pickD.indexOf(id);
      if(k>=0)pickD.splice(k,1);else if(pickD.length<5)pickD.push(id);else{toast('5 cartes au plus');return}
      const y=$('main').scrollTop;rDemo();$('main').scrollTop=y})});
}
/* ---------------- album ---------------- */
function rAlbum(){
  if(albF==='bind')return rBinders($('main'));
  const m=$('main'),n=owned().length,list=CARDS.filter(c=>(alb==='Tous'||c.p===alb)&&(albF==='all'||(albF==='own'?col[c.id]:col[c.id]>1))).sort(albS==='cout'?(a,b)=>b.k-a.k:albS==='nom'?(a,b)=>a.n.localeCompare(b.n,'fr'):()=>0);
  const nd=CARDS.reduce((a,c)=>a+Math.max(0,(col[c.id]||0)-1),0),gain=CARDS.reduce((a,c)=>a+Math.max(0,(col[c.id]||0)-1)*defVal(c),0);
  m.innerHTML=`<h2>Album</h2><p class="lead">${n} animaux sur ${CARDS.length} · ${nd} doublon${nd>1?'s':''}. Touchez une carte pour la vendre ou la défausser.</p>
    <div class="prog"><i style="width:${Math.round(n/CARDS.length*100)}%"></i><span>${Math.round(n/CARDS.length*100)} %</span></div>
    <div class="seg">${[['all','Toutes'],['own','Mes cartes'],['dup','Doublons'],['bind','Classeurs']].map(x=>`<button data-f="${x[0]}" aria-pressed="${albF===x[0]}">${x[1]}</button>`).join('')}</div>
    ${albF==='dup'&&nd?`<div class="row" style="margin:-4px 0 12px"><button class="btn ghost" id="dupAll">Défausser les ${nd} doublons : +${gain} points</button></div>`:''}
    <div class="tools"><input class="search" id="q" type="search" placeholder="Rechercher un animal" autocomplete="off" value="${esc(qA)}"><select class="search sort" id="srt" aria-label="Trier">${[['num','N°'],['cout','Coût'],['nom','Nom']].map(x=>`<option value="${x[0]}"${albS===x[0]?' selected':''}>${x[1]}</option>`).join('')}</select></div>
    <div class="packs">${['Tous',...Object.keys(PACK)].map(p=>{const L=CARDS.filter(c=>p==='Tous'||c.p===p);return `<button class="chip" data-p="${p}" style="--pc:${PACK[p]||'var(--gold)'}" aria-pressed="${p===alb}">${p}<small>${L.filter(c=>col[c.id]).length}/${L.length}</small></button>`}).join('')}</div>
    ${list.length?'':'<p class="empty-q">Aucune carte ici.</p>'}<div class="grid">${list.map(c=>col[c.id]?`<button data-id="${c.id}" data-n="${esc(norm(c.n))}" aria-label="${esc(c.n)}">${card(c,true)}${col[c.id]>1?`<span class="cnt">×${col[c.id]}</span>`:''}</button>`
      :`<button disabled aria-label="Carte manquante"><div class="miss" style="--pc:${PACK[c.p]}"><b>?</b>${esc(c.p)}</div></button>`).join('')}</div>`;
  m.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{alb=b.dataset.p;rAlbum()}));
  m.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{albF=b.dataset.f;rAlbum()}));
  if($('dupAll'))$('dupAll').addEventListener('click',()=>{const b=$('dupAll');if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Sûr ? Touchez encore pour défausser';return}
    let g=0;CARDS.forEach(c=>{while((col[c.id]||0)>1){col[c.id]--;g+=defVal(c)}});sv('col',col);setPts(pts+g);toast('Doublons défaussés : +'+g+' points');rAlbum()});
  if($('srt'))$('srt').addEventListener('change',e=>{albS=e.target.value;rAlbum()});
  bindSearch(m,v=>qA=v);
  m.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>show(BY[b.dataset.id])));
}

/* ---------------- outils de tirage ---------------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

render();
setInterval(()=>{if(tab==='sachets'&&ST.hidden)render();else{refill();$('stockN').textContent=stock.n}},1000);
</script>
